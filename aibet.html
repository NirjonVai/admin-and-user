    let allMatchesData = {};

    const toEngNum = (num) => {
      if (num === undefined || num === null) return '';
      let str = String(num);
      const banglaNums = {'০':'0', '১':'1', '২':'2', '৩':'3', '৪':'4', '৫':'5', '৬':'6', '৭':'7', '৮':'8', '৯':'9'};
      str = str.replace(/[০-৯]/g, match => banglaNums[match]);
      const match = str.match(/\d+(\.\d+)?/);
      return match ? match[0] : '';
    };

    function getTeamTotalBets(matchId, teamName) {
      let totalAmount = 0;
      if (!allPlacedBetsData || !teamName) return 0;

      const cleanMatchId = String(matchId).trim();
      const targetTeam = String(teamName).trim().toLowerCase();

      const extractBets = (node) => {
        if (!node || typeof node !== 'object') return [];
        let list = [];
        Object.values(node).forEach(item => {
          if (!item) return;
          if (item.matchId || item.match_id || item.selectedOption || item.optionName || item.amount || item.betAmount) {
            list.push(item);
          } else if (typeof item === 'object') {
            Object.values(item).forEach(subItem => {
              if (subItem && typeof subItem === 'object') list.push(subItem);
            });
          }
        });
        return list;
      };

      const allBetsList = extractBets(allPlacedBetsData);

      allBetsList.forEach(bet => {
        if (!bet) return;
        if (['refunded', 'returned', 'cancelled'].includes(bet.status)) return;

        const betMatchId = String(bet.matchId || bet.match_id || bet.betId || '').trim();
        if (betMatchId !== cleanMatchId) return;

        const selected = String(bet.selectedOption || bet.optionName || bet.option || bet.team || bet.betOn || '').trim().toLowerCase();
        if (selected.includes(targetTeam)) {
          const amt = Number(bet.amount || bet.betAmount || bet.stake || bet.bet_amount || bet.money || 0);
          if (!isNaN(amt)) totalAmount += amt;
        }
      });

      return totalAmount;
    }

    function determineAutoWinnerWithProbability(matchId, matchData) {
      const team1 = matchData.team1?.name || 'Team 1';
      const team2 = matchData.team2?.name || 'Team 2';

      const team1Bet = getTeamTotalBets(matchId, team1);
      const team2Bet = getTeamTotalBets(matchId, team2);

      const randomPercent = Math.floor(Math.random() * 100);

      if (randomPercent < 80) {
        if (team1Bet > team2Bet) {
          return team2; 
        } else if (team2Bet > team1Bet) {
          return team1; 
        } else {
          return Math.random() > 0.5 ? team1 : team2;
        }
      } else {
        return Math.random() > 0.5 ? team1 : team2;
      }
    }

    function calculateScoreFromTimestamp(match, currentTime = Date.now()) {
      const startTime = match.startTime || currentTime;
      const status = match.status;
      const maxOvers = Number(match.overs) || 20;

      let team1Name = match.team1?.name || 'Team 1';
      let team2Name = match.team2?.name || 'Team 2';
      let team1Logo = match.team1?.logo || '';
      let team2Logo = match.team2?.logo || '';

      let team1Code = team1Name.substring(0, 3).toUpperCase();
      let team2Code = team2Name.substring(0, 3).toUpperCase();

      if (status !== 'live' && status !== 'finished') {
        return {
          innings: 1, 
          team1Code, team2Code,
          battingTeam: team1Code, 
          bowlingTeam: team2Code,
          battingLogo: team1Logo,
          team1FullName: team1Name, team2FullName: team2Name,
          runs: 0, wickets: 0, over: 0, ball: 0,
          team1Runs: 0, team1Wickets: 0, team1Over: 0, team1Ball: 0,
          team2Runs: 0, team2Wickets: 0, team2Over: 0, team2Ball: 0,
          recentBalls: [], target: 0, isMatchOver: false, maxOvers: maxOvers,
          winnerCode: null, winText: ''
        };
      }

      const elapsedSeconds = Math.max(0, Math.floor((currentTime - startTime) / 1000));
      const totalBallsPlayed = Math.floor(elapsedSeconds / 4);

      const seedRandom = (seed) => {
        let x = Math.sin(seed) * 10000;
        return x - Math.floor(x);
      };

      let s = {
        innings: 1, 
        team1Code, team2Code,
        battingTeam: team1Code, 
        bowlingTeam: team2Code,
        battingLogo: team1Logo,
        team1FullName: team1Name, 
        team2FullName: team2Name,
        runs: 0, wickets: 0, over: 0, ball: 0,
        team1Runs: 0, team1Wickets: 0, team1Over: 0, team1Ball: 0,
        team2Runs: 0, team2Wickets: 0, team2Over: 0, team2Ball: 0,
        recentBalls: [], target: 0, isMatchOver: (status === 'finished'), maxOvers: maxOvers,
        winnerCode: match.winner ? match.winner.substring(0, 3).toUpperCase() : null,
        winText: ''
      };

      for (let currentBall = 1; currentBall <= totalBallsPlayed; currentBall++) {
        if (s.isMatchOver) break;

        const rand = seedRandom(startTime + currentBall);
        let event = '0';
        if (rand < 0.35) event = '0';
        else if (rand < 0.65) event = '1';
        else if (rand < 0.78) event = '2';
        else if (rand < 0.88) event = '4';
        else if (rand < 0.94) event = '6';
        else if (rand < 0.97) event = 'wd';
        else event = 'W';

        if (event === 'wd') {
          s.runs += 1;
        } else if (event === 'W') {
          s.wickets += 1;
          s.ball += 1;
        } else {
          s.runs += parseInt(event);
          s.ball += 1;
        }

        s.recentBalls.push(event);
        if (s.recentBalls.length > 6) s.recentBalls.shift();

        if (s.ball >= 6) {
          s.over += 1;
          s.ball = 0;
        }

        if (s.innings === 1) {
          s.team1Runs = s.runs;
          s.team1Wickets = s.wickets;
          s.team1Over = s.over;
          s.team1Ball = s.ball;

          if (s.over >= maxOvers || s.wickets >= 10) {
            s.target = s.runs + 1;
            const minTarget = Math.max(20, maxOvers * 6);
            if (s.target < minTarget) s.target = minTarget;

            s.innings = 2;
            s.battingTeam = team2Code;
            s.bowlingTeam = team1Code;
            s.battingLogo = team2Logo;
            s.runs = 0; s.wickets = 0; s.over = 0; s.ball = 0;
            s.recentBalls = [];
          }
        } 
        else if (s.innings === 2) {
          s.team2Runs = s.runs;
          s.team2Wickets = s.wickets;
          s.team2Over = s.over;
          s.team2Ball = s.ball;

          if (s.runs >= s.target || s.over >= maxOvers || s.wickets >= 10) {
            s.isMatchOver = true;
          }
        }
      }

      // জয়ের হিসাব ও বিজয়ী টিম টেক্সট নির্ধারণ
      if (s.isMatchOver || status === 'finished') {
        if (s.team2Runs >= s.target && s.target > 0) {
          s.winnerCode = team2Code;
          const remainingWickets = 10 - s.team2Wickets;
          s.winText = `${team2Code} won by ${remainingWickets} wickets`;
        } else if (s.team1Runs > s.team2Runs) {
          s.winnerCode = team1Code;
          const diffRuns = s.team1Runs - s.team2Runs;
          s.winText = `${team1Code} won by ${diffRuns} runs`;
        } else if (s.winnerCode) {
          s.winText = `${s.winnerCode} WON`;
        } else {
          s.winText = `Match Finished`;
        }
      }

      return s;
    }

    function calculateDynamicOdds(market, oKey, currentScore, matchData) {
      if (!currentScore || !market || !market.options) return null;

      const runs = currentScore.runs || 0;
      const wickets = currentScore.wickets || 0;
      const totalOvers = currentScore.maxOvers || 20;
      const currentOvers = currentScore.over + (currentScore.ball / 6);

      const team1Name = String(matchData?.team1?.name || '').toLowerCase().trim();
      const team2Name = String(matchData?.team2?.name || '').toLowerCase().trim();
      const team1Code = team1Name.substring(0, 3);
      const team2Code = team2Name.substring(0, 3);

      let winProbTeam1 = 0.50; 

      if (currentScore.innings === 1) {
        const expectedRR = 7.5;
        const currentRR = currentOvers > 0 ? (runs / currentOvers) : expectedRR;
        let scoreImpact = ((currentRR - expectedRR) * 0.04) - (wickets * 0.06);
        winProbTeam1 = Math.max(0.10, Math.min(0.90, 0.50 + scoreImpact));
      } else {
        const target = currentScore.target || (totalOvers * 7);
        const remainingRuns = Math.max(0, target - runs);
        const remainingBalls = Math.max(1, (totalOvers * 6) - (currentScore.over * 6 + currentScore.ball));
        const reqRR = (remainingRuns / remainingBalls) * 6;
        const initReqRR = (target / totalOvers);
        
        let chaseImpact = ((reqRR - initReqRR) * 0.05) + (wickets * 0.07);
        winProbTeam1 = Math.max(0.05, Math.min(0.95, 0.50 + chaseImpact));
      }

      let winProbTeam2 = 1.0 - winProbTeam1;

      const opt = market.options[oKey];
      if (!opt) return null;

      const optName = String(opt.name || '').toLowerCase().trim();
      const optionKeys = Object.keys(market.options);

      let finalOdds = 1.85;

      const isTeam1Opt = optName === 'w1' || optName.includes(team1Name) || (team1Code && optName.includes(team1Code));
      const isTeam2Opt = optName === 'w2' || optName.includes(team2Name) || (team2Code && optName.includes(team2Code));
      const isDrawOpt = optName === 'x' || optName.includes('draw') || optName.includes('tie');

      if (isTeam1Opt) {
        finalOdds = (1 / winProbTeam1) * 0.92; 
      } else if (isTeam2Opt) {
        finalOdds = (1 / winProbTeam2) * 0.92;
      } else if (isDrawOpt) {
        finalOdds = 12.50; 
      } else {
        let shift = (winProbTeam1 - 0.50);
        const isFirstOrPositive = (oKey === optionKeys[0]) || optName.includes('over') || optName.includes('yes');
        
        if (isFirstOrPositive) {
          finalOdds = 1.85 - (shift * 1.5);
        } else {
          finalOdds = 1.85 + (shift * 1.5);
        }
      }

      finalOdds = Math.max(1.05, Math.min(15.00, finalOdds));
      return finalOdds.toFixed(2);
    }

    async function syncAndSaveAIScore(matchId, matchData) {
      if (!matchData || matchData.status !== 'live') return;

      const currentScore = calculateScoreFromTimestamp(matchData);
      const dbBallCount = ((matchData.aiScore?.over || 0) * 6) + (matchData.aiScore?.ball || 0);
      const currentBallCount = (currentScore.over * 6) + currentScore.ball;
      const dbInnings = matchData.aiScore?.innings || 1;

      const updatePayload = {};

      if (currentBallCount > dbBallCount || currentScore.innings !== dbInnings || !matchData.aiScore) {
        updatePayload.aiScore = currentScore;
        
        if (currentScore.isMatchOver) {
          const forcedWinner = currentScore.winnerCode || determineAutoWinnerWithProbability(matchId, matchData);
          updatePayload.status = 'finished';
          updatePayload.winner = forcedWinner;
        }

        if (matchData.customMarkets) {
          Object.keys(matchData.customMarkets).forEach(mKey => {
            const market = matchData.customMarkets[mKey];
            if (market && market.options && !market.isLocked) {
              Object.keys(market.options).forEach(oKey => {
                const updatedOdds = calculateDynamicOdds(market, oKey, currentScore, matchData);
                if (updatedOdds) {
                  updatePayload[`customMarkets/${mKey}/options/${oKey}/val`] = updatedOdds;
                }
              });
            }
          });
        }

        try {
          await update(ref(db, `bets/${matchId}`), updatePayload);
        } catch (err) {
          console.error("Firebase Sync Error:", err);
        }
      }
      return currentScore;
    }

    function listenToData() {
      onValue(ref(db, 'bets'), (snapshot) => {
        allMatchesData = snapshot.exists() ? snapshot.val() : {};
        renderAIMatches();
      });

      onValue(ref(db, 'placedBets'), (snapshot) => {
        allPlacedBetsData = snapshot.exists() ? snapshot.val() : {};
        renderAIMatches();
      });

      onValue(ref(db, 'userBets'), (snapshot) => {
        if (snapshot.exists()) {
          allPlacedBetsData = { ...allPlacedBetsData, ...snapshot.val() };
          renderAIMatches();
        }
      });
    }

    function getOptionTotalBet(matchId, mKey, oKey, optionName) {
      let total = 0;
      if (!allPlacedBetsData) return 0;

      const cleanMatchId = String(matchId).trim();
      const cleanOptName = optionName ? String(optionName).trim().toLowerCase() : '';
      const cleanOptKey = oKey ? String(oKey).trim().toLowerCase() : '';

      const marketObj = allMatchesData[matchId]?.customMarkets?.[mKey];
      const targetMarketTitle = marketObj?.title ? String(marketObj.title).trim().toLowerCase() : '';

      const extractBets = (node) => {
        if (!node || typeof node !== 'object') return [];
        let list = [];
        Object.values(node).forEach(item => {
          if (!item) return;
          if (item.matchId || item.match_id || item.selectedOption || item.optionName || item.amount || item.betAmount) {
            list.push(item);
          } else if (typeof item === 'object') {
            Object.values(item).forEach(subItem => {
              if (subItem && typeof subItem === 'object') list.push(subItem);
            });
          }
        });
        return list;
      };

      const allBetsList = extractBets(allPlacedBetsData);

      allBetsList.forEach(bet => {
        if (!bet) return;
        if (['refunded', 'returned', 'cancelled'].includes(bet.status)) return;

        const betMatchId = String(bet.matchId || bet.match_id || bet.betId || '').trim();
        if (betMatchId !== cleanMatchId) return;

        const betMarketKey = String(bet.marketKey || bet.mKey || bet.marketId || '').trim();
        const betMarketTitle = String(bet.marketTitle || bet.market || bet.title || '').trim().toLowerCase();

        if (betMarketKey && betMarketKey !== mKey) return;
        if (targetMarketTitle && betMarketTitle && betMarketTitle !== targetMarketTitle) return;

        const betOptKey = String(bet.optionKey || bet.option_key || bet.optKey || bet.optionId || '').trim().toLowerCase();
        const betOptName = String(bet.selectedOption || bet.optionName || bet.option || bet.team || bet.betOn || '').trim().toLowerCase();

        const isKeyMatch = cleanOptKey && betOptKey === cleanOptKey;
        const isNameMatch = cleanOptName && betOptName === cleanOptName;

        if (isKeyMatch || isNameMatch) {
          const amt = Number(bet.amount || bet.betAmount || bet.stake || bet.bet_amount || bet.money || 0);
          if (!isNaN(amt)) total += amt;
        }
      });

      return total;
    }

    function renderAIMatches() {
      const activeElement = document.activeElement;
      if (activeElement && (
          activeElement.classList.contains('market-title-input') || 
          activeElement.classList.contains('custom-option-name') || 
          activeElement.classList.contains('custom-option-val') ||
          activeElement.tagName === 'INPUT'
      )) {
        return; 
      }

      matchesContainer.innerHTML = '';
      const keys = Object.keys(allMatchesData);
      const aiMatchKeys = keys.filter(id => allMatchesData[id] && allMatchesData[id].category === 'AI Match');

      if (aiMatchKeys.length === 0) {
        matchesContainer.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-gray-200">
            <i class="fa-solid fa-robot text-4xl text-gray-300 mb-3"></i>
            <p class="text-gray-500 font-medium">No AI Matches found.</p>
          </div>
        `;
        return;
      }

      aiMatchKeys.forEach((matchId) => {
        const matchData = allMatchesData[matchId];
        const computedScore = calculateScoreFromTimestamp(matchData);
        syncAndSaveAIScore(matchId, matchData);
        renderMatchCard(matchId, matchData, computedScore);
      });
    }

    function renderMatchCard(id, data, aiScore) {
      const isLive = data.status === 'live';
      const statusBadgeClass = isLive 
        ? 'bg-red-500/10 text-red-500 border-red-500/20' 
        : data.status === 'finished'

    // আপডেট করা স্কোরবোর্ড ফাংশন - বিজয়ী দলের পাশে ট্রফি (🏆) এবং জয়লাভের বিবরণ শো হবে
    function getScoreboardHTML(data, aiScore, isLive) {
      const maxOvers = aiScore.maxOvers || data.overs || 20;
      const totalOversPlayed = aiScore.over + (aiScore.ball / 6);
      const crr = totalOversPlayed > 0 ? (aiScore.runs / totalOversPlayed).toFixed(2) : "0.00";

      let rrr = "0.00";
      let targetDisplay = aiScore.target || (aiScore.innings === 2 ? 100 : 0);
      let statusText = '';

      const isFinished = data.status === 'finished' || aiScore.isMatchOver;

      if (isFinished) {
        statusText = aiScore.winText || (data.winner ? `${data.winner} WON` : 'Match Finished');
      } else if (aiScore.innings === 2 && aiScore.target > 0) {
        const remainingRuns = Math.max(0, aiScore.target - aiScore.runs);
        const remainingBalls = Math.max(0, (maxOvers * 6) - (aiScore.over * 6 + aiScore.ball));
        rrr = remainingBalls > 0 ? ((remainingRuns / remainingBalls) * 6).toFixed(2) : "0.00";
        statusText = `${aiScore.battingTeam} need ${remainingRuns} runs in ${remainingBalls} balls`;
      } else {
        statusText = `1st Innings: ${aiScore.battingTeam} is batting`;
      }

      // টিমের নাম এবং রান প্রদর্শনী
      const isTeam1Winner = isFinished && (aiScore.winnerCode === aiScore.team1Code || data.winner?.includes(aiScore.team1Code));
      const isTeam2Winner = isFinished && (aiScore.winnerCode === aiScore.team2Code || data.winner?.includes(aiScore.team2Code));

      // বলের হিসেব
      let overTotalRuns = 0;
      (aiScore.recentBalls || []).forEach(b => {
        if (b === 'wd') overTotalRuns += 1;
        else if (b !== 'W') overTotalRuns += parseInt(b) || 0;
      });

      const recentBalls = aiScore.recentBalls || [];
      const lastBall = recentBalls.length > 0 ? recentBalls[recentBalls.length - 1] : '0';

      let lastBallColor = "text-[#fef08a]";
      if (lastBall === '6') lastBallColor = "text-lime-400";
      else if (lastBall === '4') lastBallColor = "text-sky-400";
      else if (lastBall === 'W') lastBallColor = "text-red-500 animate-bounce";
      else if (lastBall === 'wd') lastBallColor = "text-amber-400";

      return `
        <!-- Top Score Area (Team 1 vs Team 2 Score Representation) -->
        <div class="flex items-center justify-between border-b border-gray-800/80 pb-3 mb-3">
          
          <!-- Team Batting / Score -->

            <img src="${aiScore.battingLogo || ''}" class="w-9 h-9 object-contain rounded-full bg-gray-800 p-1 border border-gray-700 shrink-0" onerror="this.src='https://via.placeholder.com/40?text=T'">
            <div>
              <div class="flex items-center gap-1.5">
                ${(aiScore.battingTeam === aiScore.team1Code ? isTeam1Winner : isTeam2Winner) ? '<span class="text-amber-400 text-sm">🏆</span>' : ''}
                <span class="text-sm font-bold tracking-wide text-gray-200 block leading-tight">${aiScore.battingTeam}</span>
              </div>
              <div class="flex items-baseline gap-2 mt-0.5">
                <span class="text-2xl font-black text-[#818cf8] tracking-tight font-mono">${aiScore.runs}-${aiScore.wickets}</span>
                <span class="text-xs text-gray-400 font-medium font-mono">(${aiScore.over}.${aiScore.ball})</span>
              </div>
            </div>
          </div>

          <!-- Right Trophy Indicator / Last Ball -->
          <div class="flex items-center gap-3">
            ${isFinished ? `
              <div class="flex items-center gap-1 bg-amber-500/10 border border-amber-500/30 px-2 py-1 rounded-lg">
                <span class="text-amber-400 text-base">🏆</span>
                <span class="text-xs font-bold text-amber-300 font-mono uppercase">${aiScore.winnerCode || 'WIN'}</span>
              </div>
            ` : `
              <span class="text-3xl font-extrabold ${lastBallColor} font-mono tracking-tight">${lastBall}</span>
            `}
            <i class="fa-solid ${isLive ? 'fa-volume-xmark text-gray-400' : 'fa-volume-high text-gray-600'} text-sm"></i>
          </div>

        </div>

        <!-- Middle CRR / RRR / Target Line -->
        <div class="flex items-center justify-between text-xs text-gray-300 font-medium mb-3 px-1">
          <div>CRR: <span class="font-bold font-mono text-white">${crr}</span></div>

        <div class="bg-[#451a03]/40 border border-[#78350f]/50 text-[#fde047] text-center text-xs font-bold py-1.5 px-2 rounded-lg mb-3 tracking-wide capitalize">
          ${statusText}
        </div>

        <!-- Over & Balls Display Bar -->
        <div class="flex items-center justify-between text-xs text-gray-300 pt-1">
          <div class="flex items-center gap-1.5 overflow-x-auto py-1">
            <span class="text-gray-400 font-medium whitespace-nowrap mr-1">Over ${aiScore.over + 1}</span>
            
            ${recentBalls.length === 0 ? '<span class="text-[10px] text-gray-500 italic">Waiting...</span>' : ''}
            
            ${recentBalls.map(ball => {
              let bgClass = "bg-[#1f2937] text-gray-200 border border-gray-700";
              if (ball === '6') bgClass = "bg-[#65a30d] text-white font-bold border border-lime-500"; 
              else if (ball === '4') bgClass = "bg-[#0284c7] text-white font-bold border border-sky-400"; 
              else if (ball === 'W') bgClass = "bg-[#dc2626] text-white font-bold border border-red-500"; 
              else if (ball === 'wd') bgClass = "bg-[#d97706] text-white font-bold border border-amber-500"; 

              return `<span class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-mono shrink-0 ${bgClass}">${ball}</span>`;
            }).join('')}
          </div>

          <div class="text-xs font-bold text-gray-300 font-mono whitespace-nowrap ml-2">
            = ${overTotalRuns}
          </div>
        </div>
      `;
    }

    async function processBetPayouts(matchId, targetMKey, winningOKey, winOptName) {
      if (!allPlacedBetsData) return;

      const cleanMatchId = String(matchId).trim();
      const targetOptName = winOptName ? String(winOptName).trim().toLowerCase() : '';
      const targetOptKey = winningOKey ? String(winningOKey).trim().toLowerCase() : '';

      const marketObj = allMatchesData[matchId]?.customMarkets?.[targetMKey];
      const targetMarketTitle = marketObj?.title ? String(marketObj.title).trim().toLowerCase() : '';

      const processedBetsMap = {};

      const processNode = async (node, nodePath) => {
        if (!node || typeof node !== 'object') return;

        for (const [key, item] of Object.entries(node)) {
          if (!item) continue;
          
          const currentPath = `${nodePath}/${key}`;

          if (item.matchId || item.match_id || item.selectedOption || item.amount || item.betAmount) {
            const betMatchId = String(item.matchId || item.match_id || item.betId || '').trim();
            if (betMatchId === cleanMatchId) {
              const betMarketKey = String(item.marketKey || item.mKey || item.marketId || '').trim();
              const betMarketTitle = String(item.marketTitle || item.market || item.title || '').trim().toLowerCase();

              if (betMarketKey && betMarketKey !== targetMKey) continue;
              if (targetMarketTitle && betMarketTitle && betMarketTitle !== targetMarketTitle) continue;

              const betOptKey = String(item.optionKey || item.option_key || item.optKey || item.optionId || '').trim().toLowerCase();
              const betOptName = String(item.selectedOption || item.optionName || item.option || item.team || item.betOn || '').trim().toLowerCase();

              const isMatch = (targetOptKey && betOptKey === targetOptKey) || (targetOptName && betOptName === targetOptName);

              if (item.payoutProcessed) continue;

              const userId = item.userId || item.uid || item.user_id;
              const betAmount = Number(item.amount || item.betAmount || item.stake || 0);
              const odds = Number(item.odds || item.rate || item.val || 1);
              const winAmount = betAmount * odds;

              const betUniqueId = item.betId || `${userId}_${betAmount}_${item.createdAt || key}`;

              if (isMatch) {
                await update(ref(db, currentPath), { status: 'win', isWinner: true, payoutProcessed: true });

                if (userId && winAmount > 0 && !processedBetsMap[betUniqueId]) {
                  processedBetsMap[betUniqueId] = true;
                  try {
                    const userBalanceRef = ref(db, `users/${userId}/balance`);
                    await runTransaction(userBalanceRef, (currentBal) => {
                      return Number(currentBal || 0) + winAmount;
                    });
                  } catch (e) {
                    console.error("Payout update failed for user:", userId, e);
                  }
                }
              } else {
                await update(ref(db, currentPath), { status: 'loss', isWinner: false, payoutProcessed: true });
              }
            }
          } else if (typeof item === 'object') {
            await processNode(item, currentPath);
          }
        }
      };

      if (allPlacedBetsData.placedBets) {
        await processNode(allPlacedBetsData.placedBets, 'placedBets');
      } else {
        await processNode(allPlacedBetsData, 'placedBets');
      }

      const userBetsSnap = await get(ref(db, 'userBets'));
      if (userBetsSnap.exists()) {
        await processNode(userBetsSnap.val(), 'userBets');
      }
    }

    async function processMarketReturn(matchId, mKey) {
      if (!allPlacedBetsData) return;
      const cleanMatchId = String(matchId).trim();
      
      const market = allMatchesData[matchId]?.customMarkets?.[mKey];
      const marketTitle = market?.title ? String(market.title).trim().toLowerCase() : '';

      if (market && market.options) {
        const optionResetUpdates = {};
        Object.keys(market.options).forEach(oKey => {
          optionResetUpdates[`bets/${matchId}/customMarkets/${mKey}/options/${oKey}/isWinner`] = false;
          optionResetUpdates[`bets/${matchId}/customMarkets/${mKey}/options/${oKey}/status`] = 'pending';
        });
        optionResetUpdates[`bets/${matchId}/customMarkets/${mKey}/winningOptionKey`] = null;
        await update(ref(db), optionResetUpdates);
      }

      const processedRefunds = {};

      const processReturnNode = async (node, nodePath) => {
        if (!node || typeof node !== 'object') return;

        for (const [key, item] of Object.entries(node)) {
          if (!item) continue;
          const currentPath = `${nodePath}/${key}`;

          if (item.matchId || item.match_id || item.selectedOption || item.amount || item.betAmount) {
            const betMatchId = String(item.matchId || item.match_id || item.betId || '').trim();
            const betMarketTitle = String(item.marketTitle || item.market || item.title || '').trim().toLowerCase();
            const betMarketKey = String(item.marketKey || item.mKey || item.marketId || '').trim();

            if (betMatchId === cleanMatchId && 
               ((betMarketKey && betMarketKey === mKey) || (!marketTitle || betMarketTitle === marketTitle))) {
              
              const userId = item.userId || item.uid || item.user_id;
              const betAmount = Number(item.amount || item.betAmount || item.stake || 0);
              const currentBetStatus = String(item.status || '').toLowerCase();

              await update(ref(db, currentPath), { status: 'refunded', payoutProcessed: false, isWinner: false });

              const betUniqueId = item.betId || key;

              if (userId && betAmount > 0 && currentBetStatus !== 'returned' && currentBetStatus !== 'refunded' && !processedRefunds[betUniqueId]) {
                processedRefunds[betUniqueId] = true;
                
                try {
                  const userBalanceRef = ref(db, `users/${userId}/balance`);
                  await runTransaction(userBalanceRef, (currentBal) => {
                    return Number(currentBal || 0) + betAmount;
                  });
                } catch (err) {
                  console.error("Refund transaction failed:", err);
                }
              }
            }
          } else if (typeof item === 'object') {
            await processReturnNode(item, currentPath);
          }
        }
      };

      if (allPlacedBetsData.placedBets) {
        await processReturnNode(allPlacedBetsData.placedBets, 'placedBets');
      } else {
        await processReturnNode(allPlacedBetsData, 'placedBets');
      }

      const userBetsSnap = await get(ref(db, 'userBets'));
      if (userBetsSnap.exists()) {
        await processReturnNode(userBetsSnap.val(), 'userBets');
      }
    }

    setInterval(() => {
      if (allMatchesData && Object.keys(allMatchesData).length > 0) {
        Object.keys(allMatchesData).forEach(matchId => {
          const matchData = allMatchesData[matchId];
          if (matchData && matchData.category === 'AI Match' && matchData.status === 'live') {
            const computedScore = calculateScoreFromTimestamp(matchData);
            syncAndSaveAIScore(matchId, matchData);
            
            const scoreboardElem = document.getElementById(`scoreboard-${matchId}`);
            if (scoreboardElem) {
              scoreboardElem.innerHTML = getScoreboardHTML(matchData, computedScore, true);
            }
          }
        });
      }
    }, 4000);

    matchesContainer.addEventListener('input', (e) => {
      if (e.target.classList.contains('custom-option-val') || e.target.classList.contains('opt-val-input')) {
        e.target.value = toEngNum(e.target.value);
      }
    });

    matchesContainer.addEventListener('change', async (e) => {
      if (e.target.classList.contains('status-select')) {
        const matchId = e.target.getAttribute('data-id');
        const newStatus = e.target.value;
        const matchData = allMatchesData[matchId];
        
        const updateData = { status: newStatus };
        
        if (newStatus === 'live') {
          updateData.startTime = Date.now();
        } else if (newStatus === 'finished' && matchData) {
          const finalScore = calculateScoreFromTimestamp(matchData, Date.now());
          const winner = finalScore.winnerCode || determineAutoWinnerWithProbability(matchId, matchData);

          updateData.aiScore = finalScore;
          updateData.winner = winner;
        }

        await update(ref(db, `bets/${matchId}`), updateData);
      }

      if (e.target.classList.contains('market-title-input')) {
        const matchId = e.target.getAttribute('data-id');
        const mKey = e.target.getAttribute('data-mkey');
        await update(ref(db, `bets/${matchId}/customMarkets/${mKey}`), { title: e.target.value });
      }

      if (e.target.classList.contains('custom-option-name')) {
        const matchId = e.target.getAttribute('data-id');
        const mKey = e.target.getAttribute('data-mkey');
        const oKey = e.target.getAttribute('data-okey');
        let cleanVal = e.target.value.replace(/\s*\(\d+\)\s*$/, '').trim();
        await update(ref(db, `bets/${matchId}/customMarkets/${mKey}/options/${oKey}`), { name: cleanVal });
      }

      if (e.target.classList.contains('custom-option-val')) {
        const matchId = e.target.getAttribute('data-id');
        const mKey = e.target.getAttribute('data-mkey');
        const oKey = e.target.getAttribute('data-okey');
        await update(ref(db, `bets/${matchId}/customMarkets/${mKey}/options/${oKey}`), { val: toEngNum(e.target.value) });
      }
    });

    matchesContainer.addEventListener('click', async (e) => {
      const returnMarketBtn = e.target.closest('.return-market-btn');
      if (returnMarketBtn) {
        if (confirm("Reset market to NEW state and refund exact user stake?")) {
          const matchId = returnMarketBtn.getAttribute('data-id');
          const mKey = returnMarketBtn.getAttribute('data-mkey');
          await processMarketReturn(matchId, mKey);
          alert("Market has been reset to NEW & exact stake refunded!");
        }
        return;
      }

      const hideMarketBtn = e.target.closest('.hide-market-btn');
      if (hideMarketBtn) {
        const matchId = hideMarketBtn.getAttribute('data-id');
        const mKey = hideMarketBtn.getAttribute('data-mkey');
        const currentlyHidden = hideMarketBtn.getAttribute('data-hidden') === 'true';
        
        await update(ref(db, `bets/${matchId}/customMarkets/${mKey}`), { isHidden: !currentlyHidden });
        return;
      }

      const lockMarketBtn = e.target.closest('.lock-market-btn');
      if (lockMarketBtn) {
        const matchId = lockMarketBtn.getAttribute('data-id');
        const mKey = lockMarketBtn.getAttribute('data-mkey');
        const currentlyLocked = lockMarketBtn.getAttribute('data-locked') === 'true';
        
        await update(ref(db, `bets/${matchId}/customMarkets/${mKey}`), { isLocked: !currentlyLocked });
        return;
      }

      const deleteMarketBtn = e.target.closest('.delete-market-btn');
      if (deleteMarketBtn) {
        if (confirm("Are you sure you want to delete this market?")) {
          const matchId = deleteMarketBtn.getAttribute('data-id');
          const mKey = deleteMarketBtn.getAttribute('data-mkey');
          await remove(ref(db, `bets/${matchId}/customMarkets/${mKey}`));
        }
        return;
      }

      const winBtn = e.target.closest('.set-option-win-btn');
      if (winBtn) {
        const matchId = winBtn.getAttribute('data-id');
        const mKey = winBtn.getAttribute('data-mkey');
        const targetOKey = winBtn.getAttribute('data-okey');

        const market = allMatchesData[matchId]?.customMarkets?.[mKey];
        if (!market || !market.options) return;

        const updates = {};
        let winningOptionName = '';
        
        Object.keys(market.options).forEach((oKey) => {
          const basePath = `bets/${matchId}/customMarkets/${mKey}/options/${oKey}`;
          if (oKey === targetOKey) {
            updates[`${basePath}/isWinner`] = true;
            updates[`${basePath}/status`] = 'win';
            winningOptionName = market.options[oKey].name || '';
          } else {
            updates[`${basePath}/isWinner`] = false;
            updates[`${basePath}/status`] = 'loss';
          }
        });

        updates[`bets/${matchId}/customMarkets/${mKey}/winningOptionKey`] = targetOKey;

        await update(ref(db), updates);
        await processBetPayouts(matchId, mKey, targetOKey, winningOptionName);
        return;
      }

      const deleteBtn = e.target.closest('.delete-btn');
      if (deleteBtn && confirm('Are you sure you want to delete this match?')) {
        const matchId = deleteBtn.getAttribute('data-id');
        await remove(ref(db, `bets/${matchId}`));
        return;
      }

      const toggleAddMarketBtn = e.target.closest('.toggle-add-market-btn');
      if (toggleAddMarketBtn) {
        const matchId = toggleAddMarketBtn.getAttribute('data-id');
        const formDiv = document.getElementById(`add-market-form-${matchId}`);
        if (formDiv) {
          formDiv.classList.toggle('hidden');
        }
        return;
      }

      const cancelAddMarketBtn = e.target.closest('.cancel-add-market-btn');
      if (cancelAddMarketBtn) {
        const matchId = cancelAddMarketBtn.getAttribute('data-id');
        const formDiv = document.getElementById(`add-market-form-${matchId}`);
        if (formDiv) {
          formDiv.classList.add('hidden');
        }
        return;
      }

      const addMoreOptionBtn = e.target.closest('.add-more-option-field-btn');
      if (addMoreOptionBtn) {
        const matchId = addMoreOptionBtn.getAttribute('data-id');
        const optionsContainer = document.getElementById(`market-options-inputs-${matchId}`);
        if (optionsContainer) {
          const newRow = document.createElement('div');
          newRow.className = "grid grid-cols-2 gap-2 option-row";
          newRow.innerHTML = `
            <input type="text" placeholder="Option Name" class="opt-name-input px-2 py-1 text-xs bg-gray-50 border border-gray-200 rounded-lg focus:outline-none">
            <input type="text" inputmode="decimal" value="1.85" placeholder="Odds" class="opt-val-input px-2 py-1 text-xs text-center font-bold bg-gray-50 border border-gray-200 rounded-lg focus:outline-none">
          `;
          optionsContainer.appendChild(newRow);
        }
        return;
      }

      const saveMarketBtn = e.target.closest('.save-market-btn');
      if (saveMarketBtn) {
        const matchId = saveMarketBtn.getAttribute('data-id');
        
        const titleInput = document.getElementById(`new-market-title-${matchId}`);
        const title = titleInput.value.trim() || "TEAM WINS 1X2";

        const optionsContainer = document.getElementById(`market-options-inputs-${matchId}`);
        const optionRows = optionsContainer.querySelectorAll('.option-row');
        
        const optionsData = {};
        optionRows.forEach((row, idx) => {
          const nameVal = row.querySelector('.opt-name-input')?.value.trim() || `OPTION ${idx + 1}`;
          const oddsVal = toEngNum(row.querySelector('.opt-val-input')?.value) || "1.85";
          optionsData[`opt_${idx + 1}`] = {
            name: nameVal,
            val: oddsVal,
            isWinner: false,
            status: 'pending'
          };
        });

        const marketRef = ref(db, `bets/${matchId}/customMarkets`);
        const newMarketRef = push(marketRef);

        await update(newMarketRef, {
          title: title,
          options: optionsData,
          isLocked: false,
          isHidden: false
        });

        titleInput.value = '';
        const formDiv = document.getElementById(`add-market-form-${matchId}`);
        if (formDiv) {
          formDiv.classList.add('hidden');
        }
        return;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        listenToData();
      } else {
        window.location.href = "login.html";
      }
    });

    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = "login.html");
    });
  </script>
</body>
  </html>
