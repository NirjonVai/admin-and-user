    const firebaseConfig = {
      apiKey: "AIzaSyBzQaaXhTtiGpMjRMBUXZaCIrDRoNyEkU4",
      authDomain: "betx-904da.firebaseapp.com",
      databaseURL: "https://betx-904da-default-rtdb.firebaseio.com",
      projectId: "betx-904da",
      storageBucket: "betx-904da.firebasestorage.app",
      messagingSenderId: "1076536561200",
      appId: "1:1076536561200:web:87ddeee59d73ed3a08e7f5",
      measurementId: "G-ER5HGVL74K"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const sidebar = document.getElementById('sidebar');
    const sidebarOpenBtn = document.getElementById('sidebar-open-btn');
    const sidebarCloseBtn = document.getElementById('sidebar-close-btn');
    const sidebarOverlay = document.getElementById('sidebar-overlay');

    const toggleSidebar = () => {

      sidebarOverlay.classList.toggle('hidden');
    };

    sidebarOpenBtn.addEventListener('click', toggleSidebar);
    sidebarCloseBtn.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', toggleSidebar);

    const logoutBtn = document.getElementById('logout-btn');
    const matchesContainer = document.getElementById('matches-container');

    let allMatchesData = {};

    const toEngNum = (num) => {
      if (num === undefined || num === null) return '';
      let str = String(num);
      const banglaNums = {'০':'0', '১':'1', '২':'2', '৩':'3', '৪':'4', '৫':'5', '৬':'6', '৭':'7', '৮':'8', '৯':'9'};
      str = str.replace(/[০-৯]/g, match => banglaNums[match]);
      str = str.replace(/[^0-9.]/g, '');
      return str;
    };

    function calculateScoreFromTimestamp(match, currentTime = Date.now()) {
      const startTime = match.startTime || currentTime;
      const status = match.status;
      const maxOvers = Number(match.overs) || 20;

      let team1Name = match.team1?.name?.substring(0, 3).toUpperCase() || 'TM1';
      let team2Name = match.team2?.name?.substring(0, 3).toUpperCase() || 'TM2';

      if (status !== 'live') {
        return {
          innings: 1, battingTeam: team1Name, bowlingTeam: team2Name,
          runs: 0, wickets: 0, over: 0, ball: 0,
          recentBalls: [], target: 0, isMatchOver: false, maxOvers: maxOvers
        };
      }

      const elapsedSeconds = Math.max(0, Math.floor((currentTime - startTime) / 1000));
      const totalBallsPlayed = Math.floor(elapsedSeconds / 4);

      const seedRandom = (seed) => {
        let x = Math.sin(seed) * 10000;
        return x - Math.floor(x);
      };

      let s = {
        innings: 1, battingTeam: team1Name, bowlingTeam: team2Name,
        runs: 0, wickets: 0, over: 0, ball: 0,
        recentBalls: [], target: 0, isMatchOver: false, maxOvers: maxOvers
      };

      for (let currentBall = 1; currentBall <= totalBallsPlayed; currentBall++) {
        if (s.isMatchOver) break;

        const rand = seedRandom(startTime + currentBall);
        let event = '0';
        if (rand < 0.35) event = '0';
        else if (rand < 0.65) event = '1';
        else if (rand < 0.78) event = '2';
        else if (rand < 0.88) event = '4';
        else if (rand < 0.94) event = '6';
        else if (rand < 0.97) event = 'wd';
        else event = 'W';

        if (event === 'wd') {
          s.runs += 1;
        } else if (event === 'W') {
          s.wickets += 1;
          s.ball += 1;
        } else {
          s.runs += parseInt(event);
          s.ball += 1;
        }

        s.recentBalls.push(event);
        if (s.recentBalls.length > 6) s.recentBalls.shift();

        if (s.ball >= 6) {
          s.over += 1;
          s.ball = 0;
        }

        if (s.innings === 1 && (s.over >= maxOvers || s.wickets >= 10)) {
          s.target = s.runs + 1;
          const minTarget = Math.max(20, maxOvers * 6);
          if (s.target < minTarget) s.target = minTarget;

          s.innings = 2;
          s.battingTeam = team2Name;
          s.bowlingTeam = team1Name;
          s.runs = 0; s.wickets = 0; s.over = 0; s.ball = 0;
          s.recentBalls = [];
        } 
        else if (s.innings === 2 && (s.runs >= s.target || s.over >= maxOvers || s.wickets >= 10)) {
          s.isMatchOver = true;
        }
      }

      return s;
    }

    async function syncAndSaveAIScore(matchId, matchData) {
      if (!matchData || matchData.status !== 'live') return;

      const currentScore = calculateScoreFromTimestamp(matchData);
      const dbBallCount = ((matchData.aiScore?.over || 0) * 6) + (matchData.aiScore?.ball || 0);
      const currentBallCount = (currentScore.over * 6) + currentScore.ball;

      if (currentBallCount > dbBallCount || !matchData.aiScore) {
        try {
          const updatePayload = { aiScore: currentScore };
          if (currentScore.isMatchOver) {
            let winner = 'draw';
            if (currentScore.runs >= currentScore.target && currentScore.innings === 2) {
              winner = currentScore.battingTeam;
            } else if (currentScore.innings === 2) {
              winner = currentScore.bowlingTeam;
            }
            updatePayload.status = 'finished';
            updatePayload.winner = winner;
          }
          await update(ref(db, `bets/${matchId}`), updatePayload);
        } catch (err) {
          console.error("Firebase Sync Error:", err);
        }
      }
      return currentScore;
    }

    function listenToBets() {
      const betsRef = ref(db, 'bets');
      onValue(betsRef, (snapshot) => {
        if (!snapshot.exists()) {
          allMatchesData = {};
          renderAIMatches();
          return;
        }
        allMatchesData = snapshot.val();
        renderAIMatches();
      });
    }

    function renderAIMatches() {
      const activeElement = document.activeElement;
      if (activeElement && (
          activeElement.classList.contains('odds-input') || 
          activeElement.classList.contains('market-title-input') || 
          activeElement.classList.contains('custom-option-name') || 
          activeElement.classList.contains('custom-option-val')
      )) {
        return; 
      }

      matchesContainer.innerHTML = '';
      const keys = Object.keys(allMatchesData);
      
      const aiMatchKeys = keys.filter(id => allMatchesData[id] && allMatchesData[id].category === 'AI Match');

      if (aiMatchKeys.length === 0) {
        matchesContainer.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-gray-200">
            <i class="fa-solid fa-robot text-4xl text-gray-300 mb-3"></i>
            <p class="text-gray-500 font-medium">No AI Matches found.</p>
          </div>
        `;
        return;
      }

      aiMatchKeys.forEach((matchId) => {
        const matchData = allMatchesData[matchId];
        const computedScore = calculateScoreFromTimestamp(matchData);
        syncAndSaveAIScore(matchId, matchData);
        renderMatchCard(matchId, matchData, computedScore);
      });
    }

    function renderMatchCard(id, data, aiScore) {
      const isLive = data.status === 'live';
      const statusBadgeClass = isLive 
        ? 'bg-red-500/10 text-red-500 border-red-500/20' 
        : data.status === 'finished' 
          ? 'bg-gray-500/10 text-gray-500 border-gray-500/20' 
          : 'bg-blue-500/10 text-blue-500 border-blue-500/20';

      const rawOdds = data.odds || {};
      const odds = {
        team1: toEngNum(rawOdds.team1 || '1.50'),
        team2: toEngNum(rawOdds.team2 || '2.66'),
        draw: toEngNum(rawOdds.draw || '4.77')
      };

      const customMarkets = data.customMarkets || {};

      const card = document.createElement('div');
      card.className = "bg-white rounded-2xl shadow-sm border border-gray-200 p-6 flex flex-col justify-between";
      card.setAttribute('data-card-id', id);

      // Generating serial-by-serial custom odds boxes matched to the UI style
      let customMarketsHTML = '';
      Object.keys(customMarkets).forEach((mKey) => {
        const market = customMarkets[mKey] || {};
        const options = market.options || {};
        const optKeys = Object.keys(options);
        const colCount = optKeys.length > 0 ? Math.min(optKeys.length, 3) : 2;

        let optionsInputsHTML = '';
        optKeys.forEach((oKey) => {
          const opt = options[oKey] || {};
          optionsInputsHTML += `
            <div class="relative group">
              <input type="text" data-id="${id}" data-mkey="${mKey}" data-okey="${oKey}" value="${opt.name || ''}" placeholder="Option Title" class="custom-option-name block text-[10px] font-bold text-gray-500 uppercase truncate w-full mb-1 bg-transparent border-b border-dashed border-gray-300 focus:border-purple-500 focus:outline-none">
              <div class="relative flex items-center">
                <input type="text" inputmode="decimal" data-id="${id}" data-mkey="${mKey}" data-okey="${oKey}" value="${toEngNum(opt.val || '1.85')}" class="custom-option-val w-full px-2 py-2 text-xs font-bold text-gray-800 bg-white border border-gray-200 rounded-xl text-center focus:outline-none focus:ring-2 focus:ring-purple-500 font-sans shadow-2xs">
                <button data-id="${id}" data-mkey="${mKey}" data-okey="${oKey}" class="delete-option-btn absolute -top-2 -right-2 bg-red-100 text-red-500 hover:bg-red-500 hover:text-white w-4 h-4 rounded-full text-[9px] flex items-center justify-center transition cursor-pointer shadow-xs" title="Remove option">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
            </div>
          `;
        });

        customMarketsHTML += `
          <div class="mt-4 pt-3 border-t border-purple-100">
            <div class="flex items-center justify-between mb-2">
              <input type="text" data-id="${id}" data-mkey="${mKey}" value="${market.title || ''}" placeholder="Market Title (e.g. Toss Winner)" class="market-title-input text-xs font-bold text-gray-700 bg-transparent border-b border-dashed border-gray-300 focus:border-purple-600 focus:outline-none w-2/3">
              <div class="flex items-center gap-1">
                <button data-id="${id}" data-mkey="${mKey}" class="add-option-btn text-[10px] text-purple-600 hover:bg-purple-100 px-2 py-0.5 rounded-lg font-semibold transition cursor-pointer flex items-center gap-1">
                  <i class="fa-solid fa-plus text-[8px]"></i> Option
                </button>
                <button data-id="${id}" data-mkey="${mKey}" class="delete-market-btn text-red-400 hover:text-red-600 p-1 rounded-lg transition cursor-pointer text-xs" title="Delete Market">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
            
            <div class="grid grid-cols-${colCount} gap-2">
              ${optionsInputsHTML || '<p class="text-[10px] text-gray-400 italic col-span-full py-1">No options added. Click "+ Option".</p>'}
            </div>
          </div>
        `;
      });

      card.innerHTML = `
        <div>
          <div class="flex justify-between items-center mb-4 pb-3 border-b border-gray-100 gap-2">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-xs font-bold uppercase tracking-wider text-purple-600 bg-purple-50 px-2.5 py-1 rounded-lg">
                ${data.sport \vert{}\vert{} 'Match'} (${data.overs || 20} Ov)
              </span>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border bg-purple-100 text-purple-600 border-purple-200">
                🤖 AI
              </span>
            </div>
            <span class="text-xs px-3 py-1 rounded-full border font-semibold capitalize ${statusBadgeClass}">
              ${data.status === 'live' ? '<i class="fa-solid fa-circle text-[8px] mr-1 animate-pulse"></i>' : ''} ${data.status}
            </span>
          </div>

          <p class="text-xs font-medium text-gray-400 mb-4">${data.league || 'AI Virtual League'}</p>

          <div class="flex items-center justify-between my-4 gap-2">
            <div class="flex flex-col items-center text-center w-1/3">
              <img src="${data.team1?.logo \vert{}\vert{} ''}" alt="${data.team1?.name || ''}" class="w-12 h-12 object-contain mb-2 rounded-full bg-gray-50 p-1 border border-gray-100" onerror="this.src='https://via.placeholder.com/50?text=T1'">
              <span class="text-xs font-bold text-gray-800 line-clamp-1">${data.team1?.name || 'Team 1'}</span>
            </div>

            <div class="text-center">
              <span class="text-xs font-black text-gray-300 bg-gray-100 px-2 py-1 rounded-md">VS</span>
            </div>

            <div class="flex flex-col items-center text-center w-1/3">
              <img src="${data.team2?.logo \vert{}\vert{} ''}" alt="${data.team2?.name || ''}" class="w-12 h-12 object-contain mb-2 rounded-full bg-gray-50 p-1 border border-gray-100" onerror="this.src='https://via.placeholder.com/50?text=T2'">
              <span class="text-xs font-bold text-gray-800 line-clamp-1">${data.team2?.name || 'Team 2'}</span>
            </div>
          </div>

          <!-- Dynamic Scoreboard Area -->
          <div id="scoreboard-${id}" class="bg-gray-900 text-white p-3.5 rounded-xl my-3 shadow-inner">
            ${getScoreboardHTML(data, aiScore, isLive)}
          </div>

          <div class="text-center text-xs text-gray-500 my-3 bg-gray-50 py-2 rounded-lg">
            <i class="fa-regular fa-clock mr-1"></i> ${new Date(data.matchDate || Date.now()).toLocaleString('en-US')}
          </div>

          <!-- Primary Match Odds Card Container -->
          <div class="bg-purple-50/60 border border-purple-100 rounded-xl p-3.5 my-4">
            <div class="flex items-center justify-between mb-3">
              <span class="text-[11px] font-bold text-gray-700 flex items-center gap-1">
                <i class="fa-solid fa-chart-line text-purple-600"></i> Primary Match Odds
              </span>
              <span class="text-[10px] text-gray-400">Multiplier (x)</span>
            </div>

            <!-- Serial 1: Default Match Winner 1X2 Market -->
            <div>
              <p class="text-xs font-semibold mb-2 text-gray-600">Match Winner (1X2)</p> 
              <div class="grid grid-cols-3 gap-2">
                <div>
                  <label class="block text-[9px] font-semibold text-gray-500 uppercase truncate">${data.team1?.name || 'PAKISTAN'}</label>
                  <input type="text" inputmode="decimal" lang="en" data-id="${id}" data-type="team1" value="${odds.team1}" class="odds-input w-full px-2 py-2 text-xs font-bold text-gray-800 bg-white border border-gray-200 rounded-xl text-center focus:outline-none focus:ring-2 focus:ring-purple-500 font-sans shadow-2xs">
                </div>

                <div>
                  <label class="block text-[9px] font-semibold text-gray-500 uppercase truncate">DRAW</label>
                  <input type="text" inputmode="decimal" lang="en" data-id="${id}" data-type="draw" value="${odds.draw}" class="odds-input w-full px-2 py-2 text-xs font-bold text-gray-800 bg-white border border-gray-200 rounded-lg text-center focus:outline-none focus:ring-2 focus:ring-purple-500 font-sans shadow-2xs">
                </div>

                <div>
                  <label class="block text-[9px] font-semibold text-gray-500 uppercase truncate">${data.team2?.name || 'AFGHANISTAN'}</label>
                  <input type="text" inputmode="decimal" lang="en" data-id="${id}" data-type="team2" value="${odds.team2}" class="odds-input w-full px-2 py-2 text-xs font-bold text-gray-800 bg-white border border-gray-200 rounded-lg text-center focus:outline-none focus:ring-2 focus:ring-purple-500 font-sans shadow-2xs">
                </div>
              </div>
            </div>

            <!-- Serial 2, 3, 4... Serial by Serial Custom Added Betting Markets -->
            <div id="custom-markets-list-${id}">
              ${customMarketsHTML}
            </div>

            <!-- Add Market Category Button inside odds box -->
            <div class="mt-4 pt-2 flex justify-end">
              <button data-id="${id}" class="add-market-btn bg-purple-600 hover:bg-purple-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-plus text-[10px]"></i> Add Title Market
              </button>
            </div>
          </div>
        </div>

        <div class="pt-3 border-t border-gray-100 flex items-center justify-between gap-2">
          <div class="flex-1">
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Status</label>
            <select data-id="${id}" class="status-select w-full px-2 py-1.5 text-xs font-medium bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500">
              <option value="upcoming" ${data.status === 'upcoming' ? 'selected' : ''}>Upcoming</option>
              <option value="live" ${data.status === 'live' ? 'selected' : ''}>Live Now</option>
              <option value="finished" ${data.status === 'finished' ? 'selected' : ''}>Finished</option>
            </select>
          </div>

          <div class="pt-4">
            <button data-id="${id}" class="delete-btn text-xs text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-xl transition cursor-pointer flex items-center gap-1 font-semibold">
              <i class="fa-solid fa-trash-can"></i> Delete
            </button>
          </div>
        </div>
      `;

      matchesContainer.appendChild(card);
    }

    function getScoreboardHTML(data, aiScore, isLive) {
      const maxOvers = aiScore.maxOvers || data.overs || 20;

      return `
        <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-2">
          <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full ${isLive ? 'bg-red-500 animate-pulse' : 'bg-gray-500'}"></span>
            <span class="text-xs font-bold tracking-wider text-gray-200">${aiScore.battingTeam} ${aiScore.runs}/${aiScore.wickets}</span>
            <span class="text-[9px] bg-gray-800 text-gray-400 px-1.5 py-0.5 rounded font-mono">${aiScore.innings === 1 ? '1st Inn' : '2nd Inn'}</span>
          </div>
          <span class="text-[11px] font-semibold text-purple-400 bg-purple-950/80 px-2 py-0.5 rounded-md border border-purple-800/40 font-mono">
            ${aiScore.over}.${aiScore.ball} /${maxOvers} Ov
          </span>এখানে নিচে একটি সম্পূর্ণ **HTML, CSS, এবং JavaScript** কোড দেওয়া হলো। এই কোডে "+ Add Title Market" বাটনে ক্লিক করলে লাল বাক্সে নির্দেশিত "Match Winner (1X2)" Market Option সহ নতুন বেটিং মার্কেটগুলো নিচে একের পর এক (serial by serial) সুন্দরভাবে যুক্ত হতে থাকবে।

আপনি ফাইলটি `.html` নামে সেভ করে ব্রাউজারে রান করলেই একদম আপনার ইন্টারফেসের মতো কাজ করবে।

```html
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Matches Panel</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <style>
        :root {
            --primary: #8a2be2;
            --primary-light: #f3e8ff;
            --bg-light: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
            --danger: #ff4d4f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 20px;
        }

        /* Header Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: #2c3e50;
        }

        .admin-badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-block;
        }

        /* Match Banner */
        .match-teams {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 15px;
        }

        .team {
            text-align: center;
            font-weight: 700;
            font-size: 14px;
        }

        .team img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 5px;
        }

        .vs-circle {
            background: #f1f3f5;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Scoreboard */
        .scoreboard {
            background: #0f172a;
            color: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .score-team {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-team::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #6c757d;
            border-radius: 50%;
        }

        .inn-badge {
            background: rgba(255,255,255,0.1);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            color: #aaa;
        }

        .overs {
            background: #3b0764;
            color: #d8b4fe;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .score-footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
        }

        .inn-highlight {
            color: #facc15;
            font-weight: 600;
        }

        .date-picker {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Odds Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: #2c3e50;
            font-size: 15px;
        }

        .section-title i {
            color: var(--primary);
        }

        .btn-add-market {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .btn-add-market:hover {
            opacity: 0.9;
        }

        /* Odds Card Container */
        .odds-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }

        /* Match Winner / Default Card Header */
        .odds-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .odds-card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Input Market Title */
        .market-title-input {
            border: none;
            border-bottom: 1px dashed #ccc;
            padding: 4px;
            font-weight: 600;
            color: var(--text-muted);
            width: 60%;
            outline: none;
        }

        .btn-add-option {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Match Winner Grid (3 Column - Fixed) */
        .winner-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .odds-box-wrapper {
            text-align: center;
        }

        .odds-label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
        }

        .odds-input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            color: #333;
            outline: none;
            background: #fdfdfd;
        }

        /* Dynamic Market Row (2 Field Row) */
        .market-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .market-row .odds-input {
            flex: 1;
        }

        .btn-remove-row {
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
        }

        .btn-delete-card {
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
            background: none;
            border: none;
        }

        /* Status Dropdown Footer */
        .status-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            width: 60%;
            background: #fff;
        }

        .btn-delete-all {
            color: var(--danger);
            background: none;
            border: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <i class="fa-solid fa-bars" style="font-size: 20px;"></i>
            <div class="header-title">
                🤖 AI Matches Panel
            </div>
            <div class="admin-badge">Admin Active</div>
        </div>

        <!-- Team vs Team Banner -->
        <div class="match-teams">
            <div class="team">
                <img src="[https://flagcdn.com/w80/pk.png](https://flagcdn.com/w80/pk.png)" alt="Pakistan">
                <div>Pakistan</div>
            </div>
            <div class="vs-circle">VS</div>
            <div class="team">
                <img src="[https://flagcdn.com/w80/af.png](https://flagcdn.com/w80/af.png)" alt="Afghanistan">
                <div>Afghanistan</div>
            </div>
        </div>

        <!-- Live Scoreboard -->
        <div class="scoreboard">
            <div class="score-row">
                <div class="score-team">PAK 0/0 <span class="inn-badge">1st Inn</span></div>
                <div class="overs">0.0 / 10 Ov</div>
            </div>
            <div class="score-footer">
                <div>Over 1: Waiting...</div>
                <div class="inn-highlight">1st Innings</div>
            </div>
        </div>

        <!-- Date & Time -->
        <div class="date-picker">
            <i class="fa-regular fa-clock"></i> 7/25/2026, 8:30:00 AM
        </div>

        <!-- Custom Betting Header -->
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-layer-group"></i> Custom Betting Markets
            </div>
            <!-- Main Add Title Market Button -->
            <button class="btn-add-market" id="addMarketBtn">
                + Add Title Market
            </button>
        </div>

        <!-- Dynamic Markets Container (Where Serial Cards will be added) -->
        <div id="marketsContainer">
            
            <!-- Default First Market (Toss Winner) -->
            <div class="odds-card">
                <div class="odds-card-header">
                    <input type="text" class="market-title-input" value="Market Title (e.g. Toss Winner)" placeholder="Market Title">
                    <div>
                        <button class="btn-add-option" onclick="addOptionRow(this)">+ Option</button>
                        <button class="btn-delete-card" onclick="deleteCard(this)"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>

                <div class="options-wrapper">
                    <div class="market-row">
                        <input type="text" class="odds-input" value="Pakistan">
                        <input type="text" class="odds-input" value="1.85">
                        <i class="fa-solid fa-xmark btn-remove-row" onclick="removeRow(this)"></i>
                    </div>
                    <div class="market-row">
                        <input type="text" class="odds-input" value="Afghanistan">
                        <input type="text" class="odds-input" value="1.85">
                        <i class="fa-solid fa-xmark btn-remove-row" onclick="removeRow(this)"></i>
                    </div>
                </div>
            </div>

        </div>

        <!-- Status & Delete Footer -->
        <div class="status-container">
            <div>
                <label style="font-size: 11px; font-weight: 700; color: #888; display: block; margin-bottom: 2px;">STATUS</label>
                <select class="status-select">
                    <option>Finished</option>
                    <option>Live</option>
                    <option>Upcoming</option>
                </select>
            </div>
            <button class="btn-delete-all">
                <i class="fa-solid fa-trash"></i> Delete
            </button>
        </div>
    </div>

    <!-- JavaScript logic -->
    <script>
        const addMarketBtn = document.getElementById('addMarketBtn');
        const marketsContainer = document.getElementById('marketsContainer');

        // Function to create Match Winner HTML Template (Marked Area)
        function createMatchWinnerCard() {
            const card = document.createElement('div');
            card.className = 'odds-card';
            
            card.innerHTML = `
                <div class="odds-card-header">
                    <span class="odds-card-title">Match Winner (1X2)</span>
                    <button class="btn-delete-card" onclick="deleteCard(this)"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="winner-grid">
                    <div class="odds-box-wrapper">
                        <span class="odds-label">PAKISTAN</span>
                        <input type="text" class="odds-input" value="1.50">
                    </div>
                    <div class="odds-box-wrapper">
                        <span class="odds-label">DRAW</span>
                        <input type="text" class="odds-input" value="4.77">
                    </div>
                    <div class="odds-box-wrapper">
                        <span class="odds-label">AFGHANISTAN</span>
                        <input type="text" class="odds-input" value="2.66">
                    </div>
                </div>
            `;

            return card;
        }

        // Add Match Winner Card on Button Click
        addMarketBtn.addEventListener('click', () => {
            const newMarketCard = createMatchWinnerCard();
            // Appends down serial by serial
            marketsContainer.appendChild(newMarketCard);
        });

        // Remove an Option Row inside Custom Market
        function removeRow(element) {
            element.parentElement.remove();
        }

        // Delete entire Market Card
        function deleteCard(element) {
            element.closest('.odds-card').remove();
        }

        // Add dynamic custom Option row
        function addOptionRow(button) {
            const wrapper = button.closest('.odds-card').querySelector('.options-wrapper');
            if(wrapper) {
                const newRow = document.createElement('div');
                newRow.className = 'market-row';
                newRow.innerHTML = `
                    <input type="text" class="odds-input" placeholder="Option Name">
                    <input type="text" class="odds-input" placeholder="1.00">
                    <i class="fa-solid fa-xmark btn-remove-row" onclick="removeRow(this)"></i>
                `;
                wrapper.appendChild(newRow);
            }
        }
    </script>
</body>
  </html>
