    let allMatchesData = {};

    const toEngNum = (num) => {
      if (num === undefined || num === null) return '';
      let str = String(num);
      const banglaNums = {'০':'0', '১':'1', '২':'2', '৩':'3', '৪':'4', '৫':'5', '৬':'6', '৭':'7', '৮':'8', '৯':'9'};
      str = str.replace(/[০-৯]/g, match => banglaNums[match]);
      str = str.replace(/[^0-9.]/g, '');
      return str;
    };

    function calculateScoreFromTimestamp(match, currentTime = Date.now()) {
      const startTime = match.startTime || currentTime;
      const status = match.status;

      const maxOvers = Number(match.overs) || 20;

      let team1Name = match.team1?.name?.substring(0, 3).toUpperCase() || 'TM1';
      let team2Name = match.team2?.name?.substring(0, 3).toUpperCase() || 'TM2';

      if (status !== 'live') {
        return {
          innings: 1,
          battingTeam: team1Name,
          bowlingTeam: team2Name,
          runs: 0, wickets: 0, over: 0, ball: 0,
          recentBalls: [], target: 0, isMatchOver: false,
          maxOvers: maxOvers
        };
      }

      const elapsedSeconds = Math.max(0, Math.floor((currentTime - startTime) / 1000));
      const totalBallsPlayed = Math.floor(elapsedSeconds / 4);

      const seedRandom = (seed) => {
        let x = Math.sin(seed) * 10000;
        return x - Math.floor(x);
      };

      let s = {
        innings: 1,
        battingTeam: team1Name,
        bowlingTeam: team2Name,
        runs: 0, wickets: 0, over: 0, ball: 0,
        recentBalls: [], target: 0, isMatchOver: false,
        maxOvers: maxOvers
      };

      for (let currentBall = 1; currentBall <= totalBallsPlayed; currentBall++) {
        if (s.isMatchOver) break;

        const rand = seedRandom(startTime + currentBall);
        let event = '0';
        if (rand < 0.35) event = '0';
        else if (rand < 0.65) event = '1';
        else if (rand < 0.78) event = '2';
        else if (rand < 0.88) event = '4';
        else if (rand < 0.94) event = '6';
        else if (rand < 0.97) event = 'wd';
        else event = 'W';

        if (event === 'wd') {
          s.runs += 1;
        } else if (event === 'W') {
          s.wickets += 1;
          s.ball += 1;
        } else {
          s.runs += parseInt(event);
          s.ball += 1;
        }

        s.recentBalls.push(event);
        if (s.recentBalls.length > 6) s.recentBalls.shift();

        if (s.ball >= 6) {
          s.over += 1;
          s.ball = 0;
        }

        if (s.innings === 1 && (s.over >= maxOvers || s.wickets >= 10)) {
          s.target = s.runs + 1;
          const minTarget = Math.max(20, maxOvers * 6);
          if (s.target < minTarget) s.target = minTarget;

          s.innings = 2;
          s.battingTeam = team2Name;
          s.bowlingTeam = team1Name;
          s.runs = 0; s.wickets = 0; s.over = 0; s.ball = 0;
          s.recentBalls = [];
        } 
        else if (s.innings === 2 && (s.runs >= s.target || s.over >= maxOvers || s.wickets >= 10)) {
          s.isMatchOver = true;
        }
      }

      return s;
    }

    async function syncAndSaveAIScore(matchId, matchData) {
      if (!matchData || matchData.status !== 'live') return;

      const currentScore = calculateScoreFromTimestamp(matchData);
      const dbBallCount = ((matchData.aiScore?.over || 0) * 6) + (matchData.aiScore?.ball || 0);
      const currentBallCount = (currentScore.over * 6) + currentScore.ball;

      if (currentBallCount > dbBallCount || !matchData.aiScore) {
        try {
          const updatePayload = { aiScore: currentScore };
          if (currentScore.isMatchOver) {
            let winner = 'draw';
            if (currentScore.runs >= currentScore.target && currentScore.innings === 2) {
              winner = currentScore.battingTeam;
            } else if (currentScore.innings === 2) {
              winner = currentScore.bowlingTeam;
            }
            updatePayload.status = 'finished';
            updatePayload.winner = winner;
          }
          await update(ref(db, `bets/${matchId}`), updatePayload);
        } catch (err) {
          console.error("Firebase Sync Error:", err);
        }
      }
      return currentScore;
    }

    function listenToBets() {
      const betsRef = ref(db, 'bets');
      onValue(betsRef, (snapshot) => {
        if (!snapshot.exists()) {
          allMatchesData = {};
          renderAIMatches();
          return;
        }
        allMatchesData = snapshot.val();
        renderAIMatches();
      });
    }

    function renderAIMatches() {
      const activeElement = document.activeElement;
      if (activeElement && (activeElement.classList.contains('odds-input') || activeElement.classList.contains('custom-odds-input') || activeElement.classList.contains('custom-odds-title'))) {
        return; 
      }

      matchesContainer.innerHTML = '';
      const keys = Object.keys(allMatchesData);
      
      const aiMatchKeys = keys.filter(id => allMatchesData[id] && allMatchesData[id].category === 'AI Match');

      if (aiMatchKeys.length === 0) {
        matchesContainer.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-gray-200">
            <i class="fa-solid fa-robot text-4xl text-gray-300 mb-3"></i>
            <p class="text-gray-500 font-medium">No AI Matches found.</p>
          </div>
        `;
        return;
      }

      aiMatchKeys.forEach((matchId) => {
        const matchData = allMatchesData[matchId];
        const computedScore = calculateScoreFromTimestamp(matchData);
        syncAndSaveAIScore(matchId, matchData);
        renderMatchCard(matchId, matchData, computedScore);
      });
    }

    function renderMatchCard(id, data, aiScore) {
      const isLive = data.status === 'live';
      const statusBadgeClass = isLive 
        ? 'bg-red-500/10 text-red-500 border-red-500/20' 
        : data.status === 'finished' 
          ? 'bg-gray-500/10 text-gray-500 border-gray-500/20' 
          : 'bg-blue-500/10 text-blue-500 border-blue-500/20';

      const rawOdds = data.odds || {};
      const odds = {
        team1: toEngNum(rawOdds.team1 || '1.50'),
        team2: toEngNum(rawOdds.team2 || '1.50'),
        draw: toEngNum(rawOdds.draw || '2.00')
      };

      const customOddsObj = data.customOdds || {};

      const card = document.createElement('div');
      card.className = "bg-white rounded-2xl shadow-sm border border-gray-200 p-6 flex flex-col justify-between";
      card.setAttribute('data-card-id', id);

      let customOddsHTML = '';
      Object.keys(customOddsObj).forEach((cKey) => {
        const cItem = customOddsObj[cKey] || {};
        customOddsHTML += `
          <div class="flex items-center gap-2 bg-white p-2 rounded-xl border border-purple-100 shadow-2xs">
            <input type="text" data-id="${id}" data-ckey="${cKey}" value="${cItem.title || ''}" placeholder="Bet Option Title" class="custom-odds-title w-1/2 px-2.5 py-1 text-xs font-semibold text-gray-800 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
            <input type="text" inputmode="decimal" data-id="${id}" data-ckey="${cKey}" value="${toEngNum(cItem.value || '1.80')}" placeholder="Odds" class="custom-odds-input w-1/3 px-2 py-1 text-xs font-bold text-center text-purple-700 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
            <button data-id="${id}" data-ckey="${cKey}" class="delete-custom-odd-btn text-red-500 hover:text-red-700 hover:bg-red-50 p-1.5 rounded-lg transition cursor-pointer text-xs" title="Remove Option">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
      });

      card.innerHTML = `
        <div>
          <div class="flex justify-between items-center mb-4 pb-3 border-b border-gray-100 gap-2">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-xs font-bold uppercase tracking-wider text-purple-600 bg-purple-50 px-2.5 py-1 rounded-lg">

              </span>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border bg-purple-100 text-purple-600 border-purple-200">
                🤖 AI
              </span>
            </div>
            <span class="text-xs px-3 py-1 rounded-full border font-semibold capitalize ${statusBadgeClass}">
              ${data.status === 'live' ? '<i class="fa-solid fa-circle text-[8px] mr-1 animate-pulse"></i>' : ''} ${data.status}
            </span>
          </div>

          <p class="text-xs font-medium text-gray-400 mb-4">${data.league || 'AI Virtual League'}</p>

          <div class="flex items-center justify-between my-4 gap-2">
            <div class="flex flex-col items-center text-center w-1/3">
              <img src="${data.team1?.logo || ''}" alt="${data.team1?.name || ''}" class="w-12 h-12 object-contain mb-2 rounded-full bg-gray-50 p-1 border border-gray-100" onerror="this.src='https://via.placeholder.com/50?text=T1'">
              <span class="text-xs font-bold text-gray-800 line-clamp-1">${data.team1?.name || 'Team 1'}</span>
            </div>

            <div class="text-center">
              <span class="text-xs font-black text-gray-300 bg-gray-100 px-2 py-1 rounded-md">VS</span>
            </div>

            <div class="flex flex-col items-center text-center w-1/3">
              <img src="${data.team2?.logo || ''}" alt="${data.team2?.name || ''}" class="w-12 h-12 object-contain mb-2 rounded-full bg-gray-50 p-1 border border-gray-100" onerror="this.src='https://via.placeholder.com/50?text=T2'">
              <span class="text-xs font-bold text-gray-800 line-clamp-1">${data.team2?.name || 'Team 2'}</span>
            </div>
          </div>

          <!-- Dynamic Scoreboard Area -->
          <div id="scoreboard-${id}" class="bg-gray-900 text-white p-3.5 rounded-xl my-3 shadow-inner">
            ${getScoreboardHTML(data, aiScore, isLive)}
          </div>

          <div class="text-center text-xs text-gray-500 my-3 bg-gray-50 py-2 rounded-lg">
            <i class="fa-regular fa-clock mr-1"></i> ${new Date(data.matchDate || Date.now()).toLocaleString('en-US')}
          </div>

          <!-- Main Match 1X2 Odds -->
          <div class="bg-purple-50/60 border border-purple-100 rounded-xl p-3 my-4">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[11px] font-bold text-gray-700 flex items-center gap-1">
                <i class="fa-solid fa-chart-line text-purple-600"></i> Primary Match Odds

              <span class="text-[10px] text-gray-400">Multiplier (x)</span>

            <p class="text-xs font-semibold mb-2 text-gray-600">Match Winner (1X2)</p>

              </div>
            </div>
          </div>

          <!-- Custom Unlimited Odds Markets -->
          <div class="bg-gray-50 border border-gray-200 rounded-xl p-3 my-4">

              <span class="text-[11px] font-bold text-gray-700 flex items-center gap-1">

            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Status</label>
            <select data-id="${id}" class="status-select w-full px-2 py-1.5 text-xs font-medium bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500">

              <option value="finished" ${data.status === 'finished' ? 'selected' : ''}>Finished</option>

      matchesContainer.appendChild(card);

    function getScoreboardHTML(data, aiScore, isLive) {
      const maxOvers = aiScore.maxOvers || data.overs || 20;

      return `
        <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-2">
          <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full ${isLive ? 'bg-red-500 animate-pulse' : 'bg-gray-500'}"></span>
            <span class="text-xs font-bold tracking-wider text-gray-200">${aiScore.battingTeam} ${aiScore.runs}/${aiScore.wickets}</span>
            <span class="text-[9px] bg-gray-800 text-gray-400 px-1.5 py-0.5 rounded font-mono">${aiScore.innings === 1 ? '1st Inn' : '2nd Inn'}</span>
          </div>
          <span class="text-[11px] font-semibold text-purple-400 bg-purple-950/80 px-2 py-0.5 rounded-md border border-purple-800/40 font-mono">
            ${aiScore.over}.${aiScore.ball} / ${maxOvers} Ov
          </span>
        </div>
        <div class="flex flex-wrap items-center justify-between text-[11px] text-gray-300 gap-1.5">
          <div class="flex items-center gap-1 flex-wrap">
            <span class="font-medium text-gray-400">Over ${aiScore.over + 1}:</span>
            ${(aiScore.recentBalls || []).length === 0 ? '<span class="text-[10px] text-gray-500">Waiting...</span>' : ''}
            ${(aiScore.recentBalls || []).map(ball => {
              let badgeStyle = "bg-gray-800 text-gray-200";
              if (ball === '4') badgeStyle = "bg-blue-500/20 text-blue-300 font-bold";
              if (ball === '6') badgeStyle = "bg-emerald-500/20 text-emerald-300 font-bold";
              if (ball === 'wd') badgeStyle = "bg-amber-500/20 text-amber-300 font-bold";
              if (ball === 'W') badgeStyle = "bg-red-500/20 text-red-400 font-bold";
              return `<span class="${badgeStyle} px-1.5 py-0.5 rounded font-mono text-[10px]">${ball}</span>`;
            }).join('')}
          </div>
          <div class="text-xs font-bold text-amber-400 ml-auto font-mono">
            ${aiScore.innings === 2 ? `Target: ${aiScore.target}` : `1st Innings`}
          </div>
        </div>
      `;
    }

    // Realtime scoreboard update interval
    setInterval(() => {
      if (allMatchesData && Object.keys(allMatchesData).length > 0) {
        Object.keys(allMatchesData).forEach(matchId => {
          const matchData = allMatchesData[matchId];
          if (matchData && matchData.category === 'AI Match' && matchData.status === 'live') {
            const computedScore = calculateScoreFromTimestamp(matchData);
            syncAndSaveAIScore(matchId, matchData);
            
            const scoreboardElem = document.getElementById(`scoreboard-${matchId}`);
            if (scoreboardElem) {
              scoreboardElem.innerHTML = getScoreboardHTML(matchData, computedScore, true);
            }
          }
        });
      }
    }, 4000);

    matchesContainer.addEventListener('input', (e) => {
      if (e.target.classList.contains('odds-input') || e.target.classList.contains('custom-odds-input')) {
        e.target.value = toEngNum(e.target.value);
      }
    });

    matchesContainer.addEventListener('change', async (e) => {
      // Status update
      if (e.target.classList.contains('status-select')) {
        const matchId = e.target.getAttribute('data-id');
        const newStatus = e.target.value;
        const matchData = allMatchesData[matchId];
        
        const updateData = { status: newStatus };
        
        if (newStatus === 'live') {
          updateData.startTime = Date.now();
        } else if (newStatus === 'finished' && matchData) {
          const finalScore = calculateScoreFromTimestamp(matchData, Date.now());
          let winner = 'draw';
          if (finalScore.runs >= finalScore.target && finalScore.innings === 2) {
            winner = finalScore.battingTeam;
          } else if (finalScore.innings === 2) {
            winner = finalScore.bowlingTeam;
          }

          updateData.aiScore = finalScore;
          updateData.winner = winner;
        }

        await update(ref(db, `bets/${matchId}`), updateData);
      }

      // Primary 1X2 Odds update
      if (e.target.classList.contains('odds-input')) {
        const matchId = e.target.getAttribute('data-id');
        const oddsType = e.target.getAttribute('data-type');
        await update(ref(db, `bets/${matchId}/odds`), { [oddsType]: toEngNum(e.target.value) });
      }

      // Custom Odds Title update
      if (e.target.classList.contains('custom-odds-title')) {
        const matchId = e.target.getAttribute('data-id');
        const cKey = e.target.getAttribute('data-ckey');
        await update(ref(db, `bets/${matchId}/customOdds/${cKey}`), { title: e.target.value });
      }

      // Custom Odds Value update
      if (e.target.classList.contains('custom-odds-input')) {
        const matchId = e.target.getAttribute('data-id');
        const cKey = e.target.getAttribute('data-ckey');
        await update(ref(db, `bets/${matchId}/customOdds/${cKey}`), { value: toEngNum(e.target.value) });
      }
    });

    matchesContainer.addEventListener('click', async (e) => {
      // Delete whole match
      const deleteBtn = e.target.closest('.delete-btn');
      if (deleteBtn && confirm('Are you sure you want to delete this match?')) {
        const matchId = deleteBtn.getAttribute('data-id');
        await remove(ref(db, `bets/${matchId}`));
        return;
      }

      // Add dynamic custom betting option
      const addCustomOddBtn = e.target.closest('.add-custom-odd-btn');
      if (addCustomOddBtn) {
        const matchId = addCustomOddBtn.getAttribute('data-id');
        const customOddsRef = ref(db, `bets/${matchId}/customOdds`);
        await push(customOddsRef, {
          title: "New Bet Option",
          value: "1.80"
        });
        return;
      }

      // Delete custom betting option
      const deleteCustomOddBtn = e.target.closest('.delete-custom-odd-btn');
      if (deleteCustomOddBtn) {
        const matchId = deleteCustomOddBtn.getAttribute('data-id');
        const cKey = deleteCustomOddBtn.getAttribute('data-ckey');
        await remove(ref(db, `bets/${matchId}/customOdds/${cKey}`));
        return;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        listenToBets();
      } else {
        window.location.href = "login.html";
      }
    });

    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = "login.html");
    });
  </script>
</body>
</html>
