<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetX - AI Match</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-amber-400 selection:text-slate-950 pb-20 lg:pb-0">

    <!-- Header (Dashboard-এর সাথে পুরোপুরি এক) -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-2 group cursor-pointer">
                <span class="text-xl font-black tracking-widest text-white">BET<span class="text-amber-400 bg-gradient-to-r from-yellow-400 to-amber-300 bg-clip-text text-transparent">X</span></span>
            </div>

            <div class="flex items-center space-x-3 sm:space-x-4">
                <!-- User Profile Display -->
                <div class="flex items-center space-x-2 bg-slate-800/40 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-200">
                    <i class="fa-solid fa-user-circle text-amber-400 text-sm sm:text-base"></i>
                    <span id="user-display-name" class="max-w-[100px] sm:max-w-[150px] truncate">User</span>
                </div>

                <!-- Balance Box -->
                <div class="bg-slate-800/40 backdrop-blur-sm px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl flex items-center space-x-2 sm:space-x-3 border border-slate-700/60 shadow-inner">
                    <span class="text-xs sm:text-sm font-extrabold text-amber-400 tracking-wide" id="user-balance">৳500.00</span>
                    <button class="w-5 h-5 sm:w-6 sm:h-6 rounded-lg bg-amber-400/10 hover:bg-amber-400/20 text-amber-400 flex items-center justify-center transition-colors cursor-pointer">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>
        
    <!-- Main Section -->
    <main class="max-w-4xl mx-auto px-4 py-6 md:py-8 space-y-6">
        <div class="flex justify-between items-center mb-2 px-1">
            <h2 class="text-xs sm:text-sm font-black tracking-widest text-slate-200 flex items-center space-x-2">
                <span class="w-2 h-2 bg-amber-400 rounded-full animate-ping absolute inline-flex"></span>
                <span class="w-2 h-2 bg-amber-400 rounded-full relative"></span>
                <span>AI MATCHES LIVE</span>
            </h2>
        </div>

        <div id="ai-matches-list" class="space-y-6">
            <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-8 text-center shadow-xl">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-amber-400 mb-3"></i>
                <p class="text-slate-400 text-xs sm:text-sm font-semibold">Loading AI Matches from Database...</p>
            </div>
        </div>
    </main>

    <!-- Bottom Nav (Dashboard-এর সাথে মিলিয়ে তৈরি) -->
    <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-xl border-t border-slate-800/80 px-2 py-2 z-50 flex justify-around items-center shadow-2xl rounded-t-2xl">
        <a href="#" class="flex flex-col items-center justify-center text-amber-400 px-3 py-1 rounded-xl transition-all">
            <i class="fa-solid fa-fire text-lg mb-1"></i>
            <span class="text-[10px] font-bold tracking-wide">Popular</span>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 px-3 py-1 rounded-xl transition-all relative">
            <i class="fa-solid fa-star text-lg mb-1"></i>
            <span class="text-[10px] font-medium tracking-wide">Favorite</span>
        </a>
        <button class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 px-3 py-1 rounded-xl transition-all relative cursor-pointer">
            <span id="mobile-badge" class="hidden absolute -top-1 bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-950 font-black text-[9px] px-1.5 py-0.5 rounded-full border border-slate-900 scale-90">1</span>
            <i class="fa-solid fa-receipt text-lg mb-1"></i>
            <span class="text-[10px] font-medium tracking-wide">Bet Slip</span>
        </button>
        <a href="#" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 px-3 py-1 rounded-xl transition-all">
            <i class="fa-solid fa-history text-lg mb-1"></i>
            <span class="text-[10px] font-medium tracking-wide">History</span>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 px-3 py-1 rounded-xl transition-all">
            <i class="fa-solid fa-bars text-lg mb-1"></i>
            <span class="text-[10px] font-medium tracking-wide">Menu</span>
        </a>
    </nav>

    <!-- Firebase Realtime Database Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzQaaXhTtiGpMjRMBUXZaCIrDRoNyEkU4",
            authDomain: "betx-904da.firebaseapp.com",
            databaseURL: "https://betx-904da-default-rtdb.firebaseio.com",
            projectId: "betx-904da",
            storageBucket: "betx-904da.firebasestorage.app",
            messagingSenderId: "1076536561200",
            appId: "1:1076536561200:web:87ddeee59d73ed3a08e7f5",
            measurementId: "G-ER5HGVL74K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const matchesListContainer = document.getElementById('ai-matches-list');
        let localMatchesCache = {};

        // 🕒 matchDate বা startTime থেকে সঠিকভাবে সময় দেখানোর ফাংশন
        function getFormattedMatchTime(match) {
            if (match.matchDate) {
                const dateObj = new Date(match.matchDate);
                if (!isNaN(dateObj.getTime())) {
                    return dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                }
            }
            if (match.startTime) {
                const dateObj = new Date(match.startTime);
                if (!isNaN(dateObj.getTime())) {
                    return dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
                }
            }
            return 'LIVE';
        }

        // ⚡ Time-based deterministic Score Engine
        function calculateScoreFromTimestamp(match, currentTime = Date.now()) {
            const startTime = match.startTime || currentTime;
            const status = match.status;

            const maxOvers = Number(match.overs) || 20;

            let team1Name = match.team1?.name?.substring(0, 3).toUpperCase() || 'TM1';
            let team2Name = match.team2?.name?.substring(0, 3).toUpperCase() || 'TM2';

            if (status !== 'live') {
                return {
                    innings: match.aiScore?.innings || 1,
                    battingTeam: match.aiScore?.battingTeam || team1Name,
                    bowlingTeam: match.aiScore?.bowlingTeam || team2Name,
                    runs: match.aiScore?.runs || 0,
                    wickets: match.aiScore?.wickets || 0,
                    over: match.aiScore?.over || 0,
                    ball: match.aiScore?.ball || 0,
                    recentBalls: match.aiScore?.recentBalls || [],
                    target: match.aiScore?.target || 0,
                    isMatchOver: status === 'finished',
                    maxOvers: maxOvers
                };
            }

            const elapsedSeconds = Math.max(0, Math.floor((currentTime - startTime) / 1000));
            const totalBallsPlayed = Math.floor(elapsedSeconds / 4);

            const seedRandom = (seed) => {
                let x = Math.sin(seed) * 10000;
                return x - Math.floor(x);
            };

            let s = {
                innings: 1,
                battingTeam: team1Name,
                bowlingTeam: team2Name,
                runs: 0,
                wickets: 0,
                over: 0,
                ball: 0,
                recentBalls: [],
                target: 0,
                isMatchOver: false,
                maxOvers: maxOvers
            };

            for (let currentBall = 1; currentBall <= totalBallsPlayed; currentBall++) {
                if (s.isMatchOver) break;

                const rand = seedRandom(startTime + currentBall);
                let event = '0';
                if (rand < 0.35) event = '0';
                else if (rand < 0.65) event = '1';
                else if (rand < 0.78) event = '2';
                else if (rand < 0.88) event = '4';
                else if (rand < 0.94) event = '6';
                else if (rand < 0.97) event = 'wd';
                else event = 'W';

                if (event === 'wd') {
                    s.runs += 1;
                } else if (event === 'W') {
                    s.wickets += 1;
                    s.ball += 1;
                } else {
                    s.runs += parseInt(event);
                    s.ball += 1;
                }

                s.recentBalls.push(event);
                if (s.recentBalls.length > 6) s.recentBalls.shift();

                if (s.ball >= 6) {
                    s.over += 1;
                    s.ball = 0;
                }

                if (s.innings === 1 && (s.over >= maxOvers || s.wickets >= 10)) {
                    s.target = s.runs + 1;
                    s.innings = 2;
                    s.battingTeam = team2Name;
                    s.bowlingTeam = team1Name;
                    s.runs = 0;
                    s.wickets = 0;
                    s.over = 0;
                    s.ball = 0;
                    s.recentBalls = [];
                } 
                else if (s.innings === 2 && (s.runs >= s.target || s.over >= maxOvers || s.wickets >= 10)) {
                    s.isMatchOver = true;
                }
            }

            return s;
        }

        // 📡 Listen to Realtime Database
        function listenToDatabase() {
            const betsRef = ref(db, 'bets');
            onValue(betsRef, (snapshot) => {
                if (!snapshot.exists()) {
                    matchesListContainer.innerHTML = `
                        <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-8 text-center shadow-xl">
                            <i class="fa-solid fa-robot text-3xl text-slate-500 mb-2"></i>
                            <p class="text-slate-400 text-xs sm:text-sm">No active AI Matches available right now.</p>
                        </div>
                    `;
                    localMatchesCache = {};
                    return;
                }

                localMatchesCache = snapshot.val();
                renderMatches();
            });
        }

        // 🎨 Render Match HTML (Dashboard-এর কালার স্কিম ও স্টাইল প্রয়োগ করা হয়েছে)
        function renderMatches() {
            const keys = Object.keys(localMatchesCache);
            const aiKeys = keys.filter(k => localMatchesCache[k] && localMatchesCache[k].category === 'AI Match');

            if (aiKeys.length === 0) {
                matchesListContainer.innerHTML = `
                    <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-8 text-center shadow-xl">
                        <i class="fa-solid fa-robot text-3xl text-slate-500 mb-2"></i>
                        <p class="text-slate-400 text-xs sm:text-sm">No AI Matches available.</p>
                    </div>
                `;
                return;
            }

            let htmlContent = '';
            const fallbackLogo = "https://placehold.co/50x50/334155/ffffff?text=Team";

            aiKeys.forEach((matchId) => {
                const match = localMatchesCache[matchId];
                const score = calculateScoreFromTimestamp(match);

                const team1Name = match.team1?.name || 'Team 1';
                const team2Name = match.team2?.name || 'Team 2';

                const team1Code = team1Name.substring(0, 3).toUpperCase();
                const team2Code = team2Name.substring(0, 3).toUpperCase();

                const isLive = match.status === 'live';

                const oddsTeam1 = match.odds?.team1 || '1.50';
                const oddsDraw = match.odds?.draw || '2.00';
                const oddsTeam2 = match.odds?.team2 || '1.50';

                const displayTime = getFormattedMatchTime(match);

                const overSum = score.recentBalls.reduce((acc, b) => {
                    if (b === 'wd') return acc + 1;
                    if (b === 'W') return acc;
                    return acc + (parseInt(b) || 0);
                }, 0);

                const bgStyle = match.bgUrl 
                    ? `background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('${match.bgUrl}');` 
                    : `background-color: #0f172a;`;

                htmlContent += `
                <div class="rounded-xl border border-slate-700/80 shadow-2xl overflow-hidden relative group bg-cover bg-center" style="${bgStyle}">
                    
                    <!-- Match Header -->
                    <div class="p-3 md:p-4 border-b border-slate-800/80 relative">
                        <div class="absolute top-0 right-0 bg-amber-400 text-slate-950 font-black px-4 uppercase text-[8px] tracking-wider translate-x-4 translate-y-1.5 rotate-45 flex items-center justify-center shadow-md z-10">
                            ${isLive ? '<span class="w-1.5 h-1.5 bg-slate-950 rounded-full mr-1 animate-pulse"></span> Live' : match.status}
                        </div>
                        
                        <div class="flex items-center space-x-1.5 text-slate-200 text-xs font-bold tracking-wide mb-3">
                            <i class="fa-solid fa-baseball-bat-ball text-amber-400 text-[11px]"></i>
                            <span class="uppercase text-amber-400">${match.league || 'AI Cricket League'}</span>
                            <span class="text-slate-400 font-medium">• &nbsp;${displayTime}</span>
                        </div>

                        <!-- Team VS Section -->
                        <div class="space-y-3 my-2">
                            <div class="grid grid-cols-3 items-center py-2">
                                <div class="flex flex-col items-center justify-center text-center">
                                    <div class="w-10 h-10 md:w-12 md:h-12 bg-slate-800 rounded-full flex items-center justify-center shadow-md border border-slate-700 overflow-hidden mb-2">
                                        <img src="${match.team1?.logo || fallbackLogo}" alt="${team1Name}" class="w-full h-full object-cover" onerror="this.src='${fallbackLogo}'">
                                    </div>
                                    <span class="font-extrabold text-xs md:text-sm tracking-wide text-white leading-tight">${team1Name}</span>
                                </div>

                                <div class="flex justify-center">
                                    <span class="text-amber-400 font-black italic text-xl tracking-tighter">VS</span>
                                </div>

                                <div class="flex flex-col items-center justify-center text-center">
                                    <div class="w-10 h-10 md:w-12 md:h-12 bg-slate-800 rounded-full flex items-center justify-center shadow-md border border-slate-700 overflow-hidden mb-2">
                                        <img src="${match.team2?.logo || fallbackLogo}" alt="${team2Name}" class="w-full h-full object-cover" onerror="this.src='${fallbackLogo}'">
                                    </div>
                                    <span class="font-extrabold text-xs md:text-sm tracking-wide text-white leading-tight">${team2Name}</span>
                                </div>
                            </div>

                            <!-- Live Scoreboard -->
                            <div class="bg-slate-950/70 rounded-xl p-3 border border-slate-800/80 flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-7 h-7 rounded-lg bg-amber-400/10 text-amber-400 flex items-center justify-center font-black text-xs border border-amber-400/20">
                                        ${score.battingTeam}
                                    </div>
                                    <div class="flex flex-col">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${score.battingTeam} Batting</span>
                                        <div class="flex items-baseline space-x-2">
                                            <span class="text-xl md:text-2xl font-extrabold text-amber-400 tracking-tight leading-none">${score.runs}/${score.wickets}</span>
                                            <span class="text-xs font-semibold text-slate-300">(${score.over}.${score.ball}/${score.maxOvers} Ov)</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="text-right">
                                    <span class="text-[10px] font-bold text-slate-400 block uppercase mb-0.5">Last Ball</span>
                                    <span class="text-2xl font-black text-amber-400 leading-none">${score.recentBalls.length > 0 ? score.recentBalls[score.recentBalls.length - 1] : '0'}</span>
                                </div>
                            </div>

                            <!-- Over Timeline -->
                            <div class="flex items-center justify-between pt-1 text-slate-300">
                                <div class="flex items-center space-x-1.5 text-xs">
                                    <span class="font-bold text-slate-400 text-[11px]">OV ${score.over + 1}:</span>
                                    <div class="flex items-center space-x-1">
                                        ${score.recentBalls.length === 0 ? '<span class="text-slate-500 text-[10px] italic">Waiting for ball...</span>' : ''}
                                        ${score.recentBalls.map(ball => {
                                            if (ball === 'W') {
                                                return `<span class="w-5 h-5 rounded-md bg-red-500/20 text-red-400 border border-red-500/30 flex items-center justify-center font-bold text-[10px]">W</span>`;
                                            } else if (ball === 'wd') {
                                                return `<span class="w-5 h-5 rounded-md bg-slate-800 text-slate-400 border border-slate-700 flex items-center justify-center font-bold text-[10px]">wd</span>`;
                                            } else if (ball === '4' || ball === '6') {
                                                return `<span class="w-5 h-5 rounded-md bg-amber-400 text-slate-950 flex items-center justify-center font-extrabold text-[10px]">${ball}</span>`;
                                            } else {
                                                return `<span class="w-5 h-5 rounded-md bg-slate-800 text-slate-200 border border-slate-700 flex items-center justify-center font-bold text-[10px]">${ball}</span>`;
                                            }
                                        }).join('')}
                                    </div>
                                </div>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-800/80 text-amber-400 border border-slate-700/60">
                                    ${score.innings === 2 ? `Target: ${score.target}` : '1st Innings'}
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Odds Section (Dashboard Style Button Gradient) -->
                    <div class="p-3 bg-slate-900/90 border-t border-slate-800/80">
                        <div class="grid grid-cols-3 gap-2">
                            <button class="bg-gradient-to-b from-slate-800 to-slate-900 hover:from-amber-400 hover:to-amber-500 border border-slate-700 hover:border-amber-400/50 p-2 rounded-xl transition-all duration-300 group cursor-pointer text-center">
                                <span class="block text-[10px] font-bold text-slate-400 group-hover:text-slate-950 uppercase mb-0.5">W1 (${team1Code})</span>
                                <span class="font-extrabold text-xs sm:text-sm text-amber-400 group-hover:text-slate-950">${oddsTeam1}</span>
                            </button>

                            <button class="bg-gradient-to-b from-slate-800 to-slate-900 hover:from-amber-400 hover:to-amber-500 border border-slate-700 hover:border-amber-400/50 p-2 rounded-xl transition-all duration-300 group cursor-pointer text-center">
                                <span class="block text-[10px] font-bold text-slate-400 group-hover:text-slate-950 uppercase mb-0.5">DRAW</span>
                                <span class="font-extrabold text-xs sm:text-sm text-amber-400 group-hover:text-slate-950">${oddsDraw}</span>
                            </button>

                            <button class="bg-gradient-to-b from-slate-800 to-slate-900 hover:from-amber-400 hover:to-amber-500 border border-slate-700 hover:border-amber-400/50 p-2 rounded-xl transition-all duration-300 group cursor-pointer text-center">
                                <span class="block text-[10px] font-bold text-slate-400 group-hover:text-slate-950 uppercase mb-0.5">W2 (${team2Code})</span>
                                <span class="font-extrabold text-xs sm:text-sm text-amber-400 group-hover:text-slate-950">${oddsTeam2}</span>
                            </button>
                        </div>
                    </div>

                </div>
                `;
            });

            matchesListContainer.innerHTML = htmlContent;
        }

        listenToDatabase();

        setInterval(() => {
            if (localMatchesCache && Object.keys(localMatchesCache).length > 0) {
                renderMatches();
            }
        }, 4000);
    </script>
</body>
</html>
