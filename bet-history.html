<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetX - My Bet History</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbe6',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        /* Glassmorphism Effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .glass-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Hide scrollbar for category tabs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen selection:bg-amber-400 selection:text-slate-950 pb-24 lg:pb-8 flex flex-col justify-between">

    <!-- Header Section -->
    <header class="glass-panel sticky top-0 z-50 transition-all duration-200">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex justify-between items-center">
            
            <!-- Brand Logo -->
            <div class="flex items-center space-x-2 group cursor-pointer" onclick="window.location.href='index.html'">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center shadow-lg shadow-amber-500/20 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-bolt text-slate-950 font-black text-lg"></i>
                </div>
                <span class="text-xl font-extrabold tracking-wider text-white">BET<span class="text-amber-400">X</span></span>
            </div>

            <!-- Profile & Balance Bar -->
            <div class="flex items-center space-x-2.5 sm:space-x-4">
                <div class="flex items-center space-x-2 bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-300 shadow-inner">
                    <i class="fa-solid fa-circle-user text-amber-400 text-base"></i>
                    <span id="user-display-name" class="max-w-[90px] sm:max-w-[140px] truncate">Loading...</span>
                </div>

                <div class="bg-gradient-to-r from-amber-500/10 to-yellow-500/5 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl flex items-center space-x-2 border border-amber-500/20 shadow-lg shadow-amber-500/5">
                    <i class="fa-solid fa-wallet text-amber-400 text-xs sm:text-sm"></i>
                    <span class="text-xs sm:text-sm font-black text-amber-400 tracking-wide" id="user-balance">৳0.00</span>
                </div>
            </div>
            
        </div>
    </header>
        
    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full space-y-6 flex-grow">
        
        <!-- Header Title & Stats -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 glass-panel p-5 rounded-2xl">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-amber-400/10 border border-amber-400/20 flex items-center justify-center">
                    <i class="fa-solid fa-clock-rotate-left text-amber-400 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wide text-white uppercase">My Bet History</h1>
                    <p class="text-xs text-slate-400">Track and manage your live & settled wagers</p>
                </div>
            </div>

            <!-- Summary Chips -->
            <div class="flex items-center space-x-2 text-xs font-semibold">
                <div class="bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-lg text-slate-400">
                    Total Bets: <span id="total-bets-count" class="text-white font-bold">0</span>
                </div>
            </div>
        </div>

        <!-- Filter Navigation Tabs -->
        <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pb-1">
            <button onclick="filterBets('all')" id="btn-filter-all" class="px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-amber-400 text-slate-950 shadow-lg shadow-amber-400/10">
                All Bets
            </button>
            <button onclick="filterBets('pending')" id="btn-filter-pending" class="px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700">
                Pending
            </button>
            <button onclick="filterBets('won')" id="btn-filter-won" class="px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700">
                Won
            </button>
            <button onclick="filterBets('lost')" id="btn-filter-lost" class="px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700">
                Lost
            </button>
        </div>

        <!-- History List Container -->
        <div id="history-list" class="space-y-3.5">
            <div class="glass-panel rounded-2xl p-12 text-center shadow-2xl space-y-3">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-amber-400"></i>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Fetching Bet History...</p>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar (Mobile Display) -->
    <nav class="lg:hidden fixed bottom-0 left-0 right-0 glass-panel border-t border-slate-800/80 px-3 py-2.5 z-50 flex justify-around items-center rounded-t-2xl shadow-2xl">
        <a href="index.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-amber-400 px-3 py-1 rounded-xl transition-colors">
            <i class="fa-solid fa-fire text-lg mb-0.5"></i>
            <span class="text-[10px] font-semibold tracking-tight">Popular</span>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-slate-400 hover:text-amber-400 px-3 py-1 rounded-xl transition-colors">
            <i class="fa-solid fa-star text-lg mb-0.5"></i>
            <span class="text-[10px] font-semibold tracking-tight">Favorites</span>
        </a>
        <a href="index.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-amber-400 px-3 py-1 rounded-xl transition-colors">
            <i class="fa-solid fa-receipt text-lg mb-0.5"></i>
            <span class="text-[10px] font-semibold tracking-tight">Bet Slip</span>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-amber-400 px-3 py-1 rounded-xl transition-colors">
            <i class="fa-solid fa-clock-rotate-left text-lg mb-0.5"></i>
            <span class="text-[10px] font-bold tracking-tight">History</span>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-slate-400 hover:text-amber-400 px-3 py-1 rounded-xl transition-colors">
            <i class="fa-solid fa-bars text-lg mb-0.5"></i>
            <span class="text-[10px] font-semibold tracking-tight">Menu</span>
        </a>
    </nav>

    <!-- Firebase SDK Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzQaaXhTtiGpMjRMBUXZaCIrDRoNyEkU4",
            authDomain: "betx-904da.firebaseapp.com",
            databaseURL: "https://betx-904da-default-rtdb.firebaseio.com",
            projectId: "betx-904da",
            storageBucket: "betx-904da.firebasestorage.app",
            messagingSenderId: "1076536561200",
            appId: "1:1076536561200:web:87ddeee59d73ed3a08e7f5",
            measurementId: "G-ER5HGVL74K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const userNameDisplay = document.getElementById('user-display-name');
        const userBalanceDisplay = document.getElementById('user-balance');
        const historyListContainer = document.getElementById('history-list');
        const totalBetsCount = document.getElementById('total-bets-count');

        let rawUserBets = [];
        let currentFilter = 'all';

        // Check Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User Details listener
                const userRef = ref(db, `users/${user.uid}`);
                onValue(userRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        userNameDisplay.innerText = userData.username || userData.name || user.email.split('@')[0];
                        userBalanceDisplay.innerText = `৳${(parseFloat(userData.balance) || 0).toFixed(2)}`;
                    } else {
                        userNameDisplay.innerText = user.email.split('@')[0];
                    }
                });

                // Fetch Bet History Realtime
                fetchBetHistory(user.uid);
            } else {
                window.location.href = "login.html";
            }
        });

        // Filter functionality exposing globally
        window.filterBets = (type) => {
            currentFilter = type;
            
            // Update filter buttons appearance
            ['all', 'pending', 'won', 'lost'].forEach(f => {
                const btn = document.getElementById(`btn-filter-${f}`);
                if (f === type) {
                    btn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-amber-400 text-slate-950 shadow-lg shadow-amber-400/10";
                } else {
                    btn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700";
                }
            });

            renderBetList();
        };

        function renderBetList() {
            if (!rawUserBets || rawUserBets.length === 0) {
                historyListContainer.innerHTML = `
                    <div class="glass-panel rounded-2xl p-10 text-center shadow-2xl space-y-3">
                        <div class="w-12 h-12 rounded-full bg-amber-400/10 border border-amber-400/20 flex items-center justify-center mx-auto text-amber-400">
                            <i class="fa-solid fa-receipt text-xl"></i>
                        </div>
                        <p class="text-slate-300 font-bold text-sm">No Bet Records Found</p>
                        <p class="text-slate-500 text-xs max-w-xs mx-auto">You haven't placed any bets yet or no data matched your filter.</p>
                    </div>
                `;
                totalBetsCount.innerText = "0";
                return;
            }

            // Filter logic based on status
            const filteredBets = rawUserBets.filter(item => {
                const statusVal = String(item.status || '').toLowerCase().trim();
                const isWin = statusVal === 'win' || statusVal === 'won' || item.isWinner === true;
                const isLoss = statusVal === 'loss' || statusVal === 'lost' || item.isWinner === false;
                
                if (currentFilter === 'won') return isWin;
                if (currentFilter === 'lost') return isLoss;
                if (currentFilter === 'pending') return !isWin && !isLoss;
                return true; // 'all'
            });

            totalBetsCount.innerText = filteredBets.length.toString();

            if (filteredBets.length === 0) {
                historyListContainer.innerHTML = `
                    <div class="glass-panel rounded-2xl p-8 text-center text-slate-400 text-xs font-semibold">
                        No bets match the category filter "${currentFilter.toUpperCase()}".
                    </div>
                `;
                return;
            }

            let htmlContent = '';

            filteredBets.forEach((item) => {
                // Date formatting
                let dateStr = 'N/A';
                if (item.timestamp) {
                    const d = new Date(item.timestamp);
                    if (!isNaN(d.getTime())) {
                        dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ' • ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }
                }

                // Determine Status Display
                let statusBadge = '';
                const statusVal = String(item.status || '').toLowerCase().trim();

                if (statusVal === 'win' || statusVal === 'won' || item.isWinner === true) {
                    statusBadge = `
                        <span class="inline-flex items-center gap-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider">
                            <i class="fa-solid fa-circle-check text-xs"></i> Won
                        </span>`;
                } else if (statusVal === 'loss' || statusVal === 'lost' || item.isWinner === false) {
                    statusBadge = `
                        <span class="inline-flex items-center gap-1 bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider">
                            <i class="fa-solid fa-circle-xmark text-xs"></i> Lost
                        </span>`;
                } else {
                    statusBadge = `
                        <span class="inline-flex items-center gap-1 bg-amber-400/10 text-amber-400 border border-amber-400/20 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider">
                            <i class="fa-solid fa-clock text-xs animate-spin"></i> Pending
                        </span>`;
                }

                const betAmount = parseFloat(item.amount || item.betAmount || item.stake || 0);
                const odds = parseFloat(item.odds || item.rate || 1.00);
                const potentialReturn = parseFloat(item.potentialReturn || (betAmount * odds) || 0);

                htmlContent += `
                <div class="glass-card hover:border-slate-700/80 transition-all rounded-2xl p-4 sm:p-5 shadow-xl space-y-3.5 relative overflow-hidden group">
                    
                    <!-- Top Info Header -->
                    <div class="flex justify-between items-start gap-2 border-b border-slate-800/80 pb-3">
                        <div class="space-y-0.5">
                            <span class="text-[10px] font-bold text-amber-400 uppercase tracking-widest block">${item.marketTitle || 'Match Odds'}</span>
                            <h2 class="font-extrabold text-sm sm:text-base text-white tracking-wide">${item.matchTitle || 'Event Match'}</h2>
                        </div>
                        <div class="shrink-0">
                            ${statusBadge}
                        </div>
                    </div>

                    <!-- Selected Option Bar -->
                    <div class="flex items-center justify-between bg-slate-950/70 p-3 rounded-xl border border-slate-800/80 text-xs">
                        <div>
                            <span class="text-[10px] text-slate-400 block font-semibold uppercase tracking-wider mb-0.5">Pick</span>
                            <span class="font-black text-amber-400 text-sm">${item.optionName || item.selectedOption || 'N/A'}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-slate-400 block font-semibold uppercase tracking-wider mb-0.5">Odds</span>
                            <span class="font-black text-white bg-slate-800 border border-slate-700 px-2 py-0.5 rounded-md">@${odds.toFixed(2)}</span>
                        </div>
                    </div>

                    <!-- Bet Values & Timestamp -->
                    <div class="flex items-center justify-between text-xs pt-0.5">
                        <div class="flex items-center space-x-4">
                            <div>
                                <span class="text-slate-400 block text-[10px] font-semibold uppercase tracking-wider">Stake</span>
                                <span class="font-extrabold text-white text-sm">৳${betAmount.toFixed(2)}</span>
                            </div>
                            <div class="h-6 w-[1px] bg-slate-800"></div>
                            <div>
                                <span class="text-slate-400 block text-[10px] font-semibold uppercase tracking-wider">Return</span>
                                <span class="font-black text-emerald-400 text-sm">৳${potentialReturn.toFixed(2)}</span>
                            </div>
                        </div>

                        <div class="text-[10px] text-slate-500 font-semibold flex items-center gap-1">
                            <i class="fa-regular fa-clock"></i>
                            <span>${dateStr}</span>
                        </div>
                    </div>

                </div>
                `;
            });

            historyListContainer.innerHTML = htmlContent;
        }

        // Function to Fetch History Data from Realtime DB
        function fetchBetHistory(userId) {
            const extractUserBets = (obj) => {
                let bets = [];
                if (!obj || typeof obj !== 'object') return bets;

                Object.values(obj).forEach(item => {
                    if (!item) return;
                    if (typeof item === 'object') {
                        const itemUserId = String(item.userId || item.uid || '').trim();
                        if (itemUserId && itemUserId === String(userId).trim()) {
                            bets.push(item);
                        } else {
                            bets = bets.concat(extractUserBets(item));
                        }
                    }
                });
                return bets;
            };

            // Listener for 'placedBets'
            onValue(ref(db, 'placedBets'), (snapshot) => {
                let bets = [];
                if (snapshot.exists()) {
                    bets = extractUserBets(snapshot.val());
                }

                if (bets.length === 0) {
                    // Fallback to betsHistory node
                    onValue(ref(db, `betsHistory/${userId}`), (histSnapshot) => {
                        if (histSnapshot.exists()) {
                            bets = Object.values(histSnapshot.val());
                        }
                        processAndSetBets(bets);
                    }, { onlyOnce: true });
                } else {
                    processAndSetBets(bets);
                }
            });
        }

        function processAndSetBets(bets) {
            rawUserBets = bets || [];
            
            // Sort by Date (newest first)
            rawUserBets.sort((a, b) => {
                const timeA = new Date(a.timestamp || 0).getTime();
                const timeB = new Date(b.timestamp || 0).getTime();
                return timeB - timeA;
            });

            renderBetList();
        }
    </script>
</body>
</html>
