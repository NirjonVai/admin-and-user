<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetX - My Bet History</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-amber-400 selection:text-slate-950 pb-24 lg:pb-8">

    <!-- Header (Modern Sleek Theme) -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 group cursor-pointer" onclick="window.location.href='index.html'">
                <span class="text-xl font-black tracking-widest text-white">BET<span class="text-amber-400 bg-gradient-to-r from-yellow-400 to-amber-300 bg-clip-text text-transparent">X</span></span>
            </div>

            <div class="flex items-center space-x-3">
                <!-- User Profile Display -->
                <div class="flex items-center space-x-2 bg-slate-800/60 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold text-slate-200">
                    <i class="fa-solid fa-user-circle text-amber-400 text-sm"></i>
                    <span id="user-display-name" class="max-w-[100px] sm:max-w-[150px] truncate">Loading...</span>
                </div>

                <!-- Balance Box -->
                <div class="bg-amber-400/10 border border-amber-400/30 px-3 py-1.5 rounded-xl flex items-center space-x-2">
                    <span class="text-xs sm:text-sm font-extrabold text-amber-400 tracking-wide" id="user-balance">৳0.00</span>
                </div>
            </div>
        </div>
    </header>
        
    <!-- Main Content Container -->
    <main class="max-w-3xl mx-auto px-4 py-6 space-y-6">
        <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
            <h2 class="text-sm sm:text-base font-black tracking-wider text-slate-100 flex items-center space-x-2">
                <i class="fa-solid fa-receipt text-amber-400"></i>
                <span>MY BET HISTORY</span>
            </h2>
            <span id="total-bets-count" class="text-[11px] font-bold text-slate-400 bg-slate-800/80 px-2.5 py-1 rounded-full border border-slate-700/50">0 Bets</span>
        </div>

        <!-- History Items Container -->
        <div id="history-list" class="space-y-4">
            <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-10 text-center backdrop-blur-md shadow-2xl">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-amber-400 mb-3"></i>
                <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Loading Bet History...</p>
            </div>
        </div>
    </main>

    <!-- Bottom Nav (Dashboard Style) -->
    <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800/80 px-2 py-2.5 z-50 flex justify-around items-center shadow-2xl rounded-t-2xl">
        <a href="index.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 px-3 py-1 rounded-xl transition-all">
            <i class="fa-solid fa-fire text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium">Popular</span>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 px-3 py-1 rounded-xl transition-all">
            <i class="fa-solid fa-star text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium">Favorite</span>
        </a>
        <a href="index.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 px-3 py-1 rounded-xl transition-all">
            <i class="fa-solid fa-receipt text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium">Bet Slip</span>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-amber-400 px-3 py-1 rounded-xl transition-all">
            <i class="fa-solid fa-clock-rotate-left text-lg mb-0.5"></i>
            <span class="text-[10px] font-bold">History</span>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-slate-400 hover:text-slate-200 px-3 py-1 rounded-xl transition-all">
            <i class="fa-solid fa-bars text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium">Menu</span>
        </a>
    </nav>

    <!-- Firebase Realtime Database Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzQaaXhTtiGpMjRMBUXZaCIrDRoNyEkU4",
            authDomain: "betx-904da.firebaseapp.com",
            databaseURL: "https://betx-904da-default-rtdb.firebaseio.com",
            projectId: "betx-904da",
            storageBucket: "betx-904da.firebasestorage.app",
            messagingSenderId: "1076536561200",
            appId: "1:1076536561200:web:87ddeee59d73ed3a08e7f5",
            measurementId: "G-ER5HGVL74K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const userNameDisplay = document.getElementById('user-display-name');
        const userBalanceDisplay = document.getElementById('user-balance');
        const historyListContainer = document.getElementById('history-list');
        const totalBetsCount = document.getElementById('total-bets-count');

        // Check Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Fetch User Details & Balance
                const userRef = ref(db, `users/${user.uid}`);
                onValue(userRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        userNameDisplay.innerText = userData.username || userData.name || user.email.split('@')[0];
                        userBalanceDisplay.innerText = `৳${(parseFloat(userData.balance) || 0).toFixed(2)}`;
                    } else {
                        userNameDisplay.innerText = user.email.split('@')[0];
                    }
                });

                // Fetch Bet History
                loadUserBetHistory(user.uid);
            } else {
                window.location.href = "login.html";
            }
        });

        // Robust function to load bet history
        function loadUserBetHistory(userId) {
            // Listen to root placedBets node
            const betsRef = ref(db, 'placedBets');
            
            onValue(betsRef, (snapshot) => {
                let userBets = [];

                if (snapshot.exists()) {
                    const allBetsData = snapshot.val();

                    // Loop through all items in placedBets
                    Object.keys(allBetsData).forEach(key => {
                        const item = allBetsData[key];
                        if (item && (item.userId === userId || item.uid === userId)) {
                            userBets.push({ id: key, ...item });
                        }
                    });
                }

                // Fallback: If no bets found in placedBets, check betsHistory/userId node
                if (userBets.length === 0) {
                    const userBetsRef = ref(db, `betsHistory/${userId}`);
                    onValue(userBetsRef, (userSnapshot) => {
                        if (userSnapshot.exists()) {
                            const userHistoryData = userSnapshot.val();
                            Object.keys(userHistoryData).forEach(key => {
                                userBets.push({ id: key, ...userHistoryData[key] });
                            });
                        }
                        renderBetCards(userBets);
                    }, { onlyOnce: true });
                } else {
                    renderBetCards(userBets);
                }
            });
        }

        // Render UI Cards
        function renderBetCards(betsArray) {
            totalBetsCount.innerText = `${betsArray.length} Bets`;

            if (!betsArray || betsArray.length === 0) {
                historyListContainer.innerHTML = `
                    <div class="rounded-2xl border border-slate-800/80 bg-slate-900/60 p-10 text-center backdrop-blur-md shadow-xl">
                        <i class="fa-solid fa-box-open text-4xl text-amber-400/30 mb-3"></i>
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">No Bet History Found</p>
                    </div>
                `;
                return;
            }

            // Sort newest first based on timestamp string or number
            betsArray.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));

            let html = '';

            betsArray.forEach((item) => {
                // Parse Amounts
                const betAmount = parseFloat(item.amount || item.betAmount || 0);
                const odds = parseFloat(item.odds || 1.00);
                const potentialReturn = parseFloat(item.potentialReturn || (betAmount * odds));

                // Parse Date Time
                let dateFormatted = 'N/A';
                if (item.timestamp) {
                    const d = new Date(item.timestamp);
                    if (!isNaN(d.getTime())) {
                        dateFormatted = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + 
                                       ' | ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }
                }

                // Determine Status Badge accurately
                let statusBadgeHTML = '';
                const statusStr = String(item.status || '').toLowerCase().trim();

                if (statusStr === 'win' || statusStr === 'won' || item.isWinner === true) {
                    statusBadgeHTML = `
                        <span class="inline-flex items-center gap-1.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wider">
                            <i class="fa-solid fa-circle-check text-xs"></i> WON
                        </span>`;
                } else if (statusStr === 'loss' || statusStr === 'lost' || item.isWinner === false) {
                    statusBadgeHTML = `
                        <span class="inline-flex items-center gap-1.5 bg-rose-500/10 text-rose-400 border border-rose-500/30 px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wider">
                            <i class="fa-solid fa-circle-xmark text-xs"></i> LOST
                        </span>`;
                } else {
                    statusBadgeHTML = `
                        <span class="inline-flex items-center gap-1.5 bg-amber-400/10 text-amber-400 border border-amber-400/30 px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wider">
                            <i class="fa-solid fa-hourglass-half text-xs animate-pulse"></i> PENDING
                        </span>`;
                }

                html += `
                <div class="glass-card rounded-2xl p-4 shadow-xl relative overflow-hidden transition-all duration-300 hover:border-slate-700/80">
                    <!-- Top Bar: Market Title & Status -->
                    <div class="flex justify-between items-start mb-3 pb-2.5 border-b border-slate-800/80">
                        <div>
                            <span class="text-[10px] font-black text-amber-400 tracking-wider uppercase bg-amber-400/10 px-2 py-0.5 rounded-md border border-amber-400/20 inline-block mb-1">
                                ${item.marketTitle || 'Match Betting'}
                            </span>
                            <h3 class="font-extrabold text-sm sm:text-base text-slate-100 tracking-tight">
                                ${item.matchTitle || 'Match Title'}
                            </h3>
                        </div>
                        <div>
                            ${statusBadgeHTML}
                        </div>
                    </div>

                    <!-- Middle Box: Choice & Odds -->
                    <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 flex justify-between items-center mb-3">
                        <div class="space-y-0.5">
                            <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Your Pick</span>
                            <span class="text-sm font-black text-amber-400">${item.optionName || item.selectedOption || 'N/A'}</span>
                        </div>
                        <div class="text-right space-y-0.5">
                            <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Odds</span>
                            <span class="text-sm font-black text-slate-200">@${odds.toFixed(2)}</span>
                        </div>
                    </div>

                    <!-- Bottom Details: Amounts & Date -->
                    <div class="flex justify-between items-end text-xs pt-0.5">
                        <div>
                            <span class="text-[10px] font-semibold text-slate-400 block uppercase">Stake</span>
                            <span class="text-xs font-black text-slate-200">৳${betAmount.toFixed(2)}</span>
                        </div>
                        
                        <div class="text-center">
                            <span class="text-[9px] font-bold text-slate-500 block uppercase tracking-tight">${dateFormatted}</span>
                        </div>

                        <div class="text-right">
                            <span class="text-[10px] font-semibold text-slate-400 block uppercase">Potential Win</span>
                            <span class="text-xs font-black text-emerald-400">৳${potentialReturn.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
                `;
            });

            historyListContainer.innerHTML = html;
        }
    </script>
</body>
</html>
